<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   LEVEL ALL — DESIGN TOKENS
   Sampled from the Level All product UI (Scholarship Finder)
   ============================================================ */
:root{
  /* ---- Level All brand ---- */
  --blue      :#2F62E8;   /* Brilliant Blue */
  --blue-700  :#2049C9;
  --blue-400  :#7BA3FF;
  --blue-200  :#A9C2FF;
  --purple    :#B579FF;
  --pink      :#F49FFB;
  --green     :#68F4B8;
  --yellow    :#FFD810;
  --ivory     :#FCF6EC;

  /* Grounds — near-black, biased a few degrees toward the brand blue
     so the neutrals read as chosen rather than inherited greys. */
  --ink-950:#000305;   /* page */
  --ink-900:#06080E;
  --ink-880:#0A0D16;   /* media plate */
  --ink-860:#0E121C;   /* raised chrome */
  --ink-800:#191E2C;   /* hairlines */
  --ink-700:#242A3B;   /* chips */
  --ink-600:#39415A;

  /* Text */
  --tx-1:#FCF6EC; --tx-2:#B4BCD1; --tx-3:#7F8799; --tx-4:#575E70;

  /* Category accents — the five brand hues, three of them at a second step */
  --c-plan:#2F62E8; --c-academics:#7BA3FF; --c-explore:#23C4E8;
  --c-activities:#8B5CF6; --c-testing:#FFD810; --c-money:#2FD9A0;
  --c-apply:#FF6FA5; --c-decide:#FF9F1C;

  /* Type */
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  /* Geometry — overridden per zoom level */
  --media-w:264px; --media-h:106px; --rail:64px;
  --row-gap:10px; --card-r:12px; --cnt-pad:20px;
  --t-title:15.5px; --t-desc:12.5px;
  --node:13px;
  --bar:1320px;
  --shell:988px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink-950); color:var(--tx-1);
  font-family:var(--sans); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{ /* ambient brand wash */
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(47,98,232,.16), transparent 62%),
    radial-gradient(700px 500px at 92% 8%, rgba(43,88,228,.11), transparent 60%);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--blue);color:#fff}
:focus-visible{outline:2px solid var(--blue-400);outline-offset:3px;border-radius:6px}
.node:focus-visible{outline-offset:4px}
select:focus-visible{outline-offset:2px}

/* ============================================================
   TOP BAR
   ============================================================ */
.top{
  position:sticky; top:0; z-index:60;
  background:rgba(0,3,5,.82);
  backdrop-filter:saturate(1.6) blur(18px);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);
  border-bottom:1px solid var(--ink-800);
}
.top-in{
  max-width:var(--bar); margin:0 auto; padding:10px 22px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand .mk{width:26px;height:26px;flex:none}
.brand b{font-size:16.5px;font-weight:700;letter-spacing:-.022em}

.spacer{flex:1 1 auto}

/* progress ring */
.prog{display:flex;align-items:center;gap:9px;flex:none}
.prog svg{width:34px;height:34px;transform:rotate(-90deg)}
.prog .bg{fill:none;stroke:var(--ink-700);stroke-width:3.5}
.prog .fg{fill:none;stroke:var(--blue);stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)}
.prog .lbl{line-height:1.15}
.prog .lbl b{display:block;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.prog .lbl span{display:block;font-size:10.5px;color:var(--tx-3);font-weight:500}

/* grade jump nav */
.gnav{display:flex;gap:4px;background:var(--ink-860);padding:3px;border-radius:11px;border:1px solid var(--ink-800);flex:none}
.gnav button{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px 11px;border-radius:8px;font-size:12px;font-weight:600;color:var(--tx-3);
  transition:.16s; line-height:1.1;
}
.gnav button i{font-style:normal;font-size:9px;font-weight:600;color:var(--tx-4);font-variant-numeric:tabular-nums}
.gnav button:hover{background:var(--ink-700);color:var(--tx-2)}
.gnav button.on{background:var(--blue);color:#fff}
.gnav button.on i{color:rgba(255,255,255,.78)}

/* zoom control */
.zoom{display:flex;align-items:center;gap:2px;background:var(--ink-860);border:1px solid var(--ink-800);border-radius:11px;padding:3px;flex:none}
.zoom .zb{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--tx-2);transition:.14s}
.zoom .zb:hover{background:var(--ink-700);color:#fff}
.zoom .zb:disabled{opacity:.28;cursor:default;background:none}
.zoom .stops{display:flex;gap:3px;padding:0 7px;align-items:center}
.zoom .stops i{width:7px;height:7px;border-radius:99px;background:var(--ink-600);transition:.2s;cursor:pointer;display:block}
.zoom .stops i.on{background:var(--blue);width:20px}
.zoom .stops i.pas{background:var(--blue-400);opacity:.55}
.zname{
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--blue-200);min-width:56px;text-align:center;padding-right:5px;
}

/* filter legend */
.legend{
  max-width:var(--bar);margin:0 auto;padding:0 22px 10px;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;
}
.legend .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx-4);margin-right:3px}
.dd{position:relative;flex:none}
.ddbtn{
  display:inline-flex;align-items:center;gap:7px;padding:5px 9px 5px 11px;border-radius:9px;
  border:1px solid var(--ink-700);background:var(--ink-880);
  font-size:12px;font-weight:600;color:var(--tx-2);transition:.15s;
}
.ddbtn > svg:first-child{width:13px;height:13px;opacity:.75}
.ddbtn > svg:last-child{width:13px;height:13px;opacity:.6;transition:transform .18s}
.dd.open .ddbtn > svg:last-child{transform:rotate(180deg)}
.ddbtn:hover{border-color:var(--ink-600);color:var(--tx-1)}
.dd.open .ddbtn,.ddbtn.active{border-color:color-mix(in srgb,var(--blue) 55%,transparent);color:var(--tx-1)}
.ddcount[hidden]{display:none}
.ddcount{
  min-width:17px;height:17px;padding:0 5px;border-radius:99px;display:grid;place-items:center;
  background:var(--blue);color:var(--ivory);font-size:10px;font-weight:800;
  font-variant-numeric:tabular-nums;
}
.ddmenu{
  position:absolute;top:calc(100% + 6px);left:0;z-index:80;min-width:212px;
  padding:5px;border-radius:12px;background:var(--ink-860);
  border:1px solid var(--ink-700);box-shadow:0 18px 44px rgba(0,0,0,.6);
}
.ddopt{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:8px;
  font-size:12.5px;font-weight:550;color:var(--tx-2);text-align:left;transition:.12s;
}
.ddopt s{width:8px;height:8px;border-radius:99px;background:var(--k);flex:none;display:block}
.ddopt span{flex:1;min-width:0}
.ddopt svg{width:13px;height:13px;flex:none;opacity:0;color:var(--blue);transition:opacity .12s}
.ddopt:hover{background:var(--ink-700);color:var(--tx-1)}
.ddopt.on{color:var(--tx-1)}
.ddopt.on svg{opacity:1}
.ddfoot{border-top:1px solid var(--ink-700);margin-top:4px;padding-top:4px}
.ddclear{
  width:100%;padding:6px 9px;border-radius:8px;text-align:left;
  font-size:12px;font-weight:600;color:var(--blue-400);transition:.12s;
}
.ddclear:hover:not(:disabled){background:var(--ink-700)}
.ddclear:disabled{opacity:.32;cursor:default}

/* ============================================================
   TIMELINE SHELL
   ============================================================ */
.wrap{
  max-width:var(--shell);margin:0 auto;padding:0 22px 140px;position:relative;z-index:1;
  transition:max-width .32s cubic-bezier(.4,0,.2,1);
}

/* HERO */
.hero{padding:44px 0 30px;max-width:640px}
.hero .kick{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--blue-400);margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.hero .kick::before{content:'';width:22px;height:1.5px;background:var(--blue);border-radius:2px}
.hero h1{font-size:40px;line-height:1.06;letter-spacing:-.034em;font-weight:700;margin-bottom:12px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--blue-400)}
.hero p{font-size:15px;color:var(--tx-2);line-height:1.55;max-width:560px}
/* ---- GRADE SECTION ---- */
.grade{position:relative;scroll-margin-top:118px}
.ghead{
  position:sticky; top:57px; z-index:40;
  display:grid; grid-template-columns:var(--media-w) var(--rail) minmax(0,1fr);
  align-items:end; padding:26px 0 11px;
  background:var(--ink-950);
  transition:grid-template-columns .32s cubic-bezier(.4,0,.2,1);
}
.ghead::after{ /* fade sits below the plate so tasks never show through it */
  content:'';position:absolute;left:0;right:0;top:100%;height:20px;pointer-events:none;
  background:linear-gradient(180deg,var(--ink-950),rgba(0,3,5,0));
}
.ghead{position:sticky}
.ghead .num{
  grid-column:1; justify-self:end; padding-right:20px; text-align:right;
  font-size:52px; font-weight:800; letter-spacing:-.05em; line-height:.82;
  color:transparent; -webkit-text-stroke:1.5px var(--ink-600);
}
.ghead .rl{grid-column:2;justify-self:center;position:relative;height:100%}
.ghead .txt{grid-column:3;padding-left:20px;min-width:0}
.ghead h2{font-size:19px;font-weight:700;letter-spacing:-.024em;line-height:1.15;text-wrap:balance}
.ghead .sub{font-size:12.5px;color:var(--tx-3);margin-top:3px;font-weight:500}
.ghead .bar{display:flex;align-items:center;gap:9px;margin-top:8px}
.ghead .track{height:3px;background:var(--ink-800);border-radius:99px;flex:1;max-width:210px;overflow:hidden}
.ghead .fill{height:100%;background:var(--blue);border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.ghead .pct{font-family:var(--mono);font-size:10px;color:var(--tx-3);font-variant-numeric:tabular-nums}

/* ---- THE RAIL ---- */
.body{position:relative}
.railfill{
  position:absolute;top:0;width:1.5px;height:0;z-index:1;pointer-events:none;
  left:calc(var(--media-w) + var(--rail)/2);margin-left:-.75px;border-radius:2px;
  background:linear-gradient(180deg,var(--blue-400),var(--blue));
  box-shadow:0 0 9px rgba(47,98,232,.55);
  transition:height .5s cubic-bezier(.4,0,.2,1), left .32s cubic-bezier(.4,0,.2,1);
}
.body::before{ /* the continuous vertical line */
  content:''; position:absolute; top:0; bottom:0;
  left:calc(var(--media-w) + var(--rail)/2); width:1.5px; margin-left:-.75px;
  background:linear-gradient(180deg,var(--ink-700),var(--ink-600) 12%,var(--ink-600) 88%,var(--ink-700));
  transition:left .32s cubic-bezier(.4,0,.2,1);
}

/* ---- MONTH DIVIDER ---- */
.mrow{
  display:grid;grid-template-columns:var(--media-w) var(--rail) minmax(0,1fr);
  align-items:center;padding:14px 0 8px;position:relative;
  transition:grid-template-columns .32s cubic-bezier(.4,0,.2,1);
}
.mrow .mchip{
  grid-column:2;justify-self:center;position:relative;z-index:3;
  font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.09em;
  padding:3.5px 8px;border-radius:7px;background:var(--ink-860);
  border:1px solid var(--ink-700);color:var(--tx-2);white-space:nowrap;
}
.mrow .mline{grid-column:3;height:1px;background:var(--ink-800);margin-left:20px;opacity:.75}
.mrow .myear{
  grid-column:1;justify-self:end;padding-right:20px;
  font-family:var(--mono);font-size:9.5px;color:var(--tx-4);letter-spacing:.06em;
}

/* ---- TASK ROW ---- */
.task{
  display:grid; grid-template-columns:var(--media-w) var(--rail) minmax(0,1fr);
  align-items:center; margin-bottom:var(--row-gap); position:relative;
  transition:grid-template-columns .32s cubic-bezier(.4,0,.2,1);
}
.task.hidden{display:none}

/* media (LEFT of the line) */
.media{
  grid-column:1; justify-self:end; position:relative;
  width:var(--media-w); height:var(--media-h);
  border-radius:var(--card-r); overflow:hidden;
  background:var(--ink-880); border:1px solid var(--ink-800);
  transition:width .32s cubic-bezier(.4,0,.2,1),height .32s cubic-bezier(.4,0,.2,1),border-color .18s,transform .18s;
}
.media svg{width:100%;height:100%;display:block}
.media::after{ /* colour wash — only earns its place when the plate is too small to read */
  content:'';position:absolute;inset:0;background:var(--k);opacity:0;
  transition:opacity .32s cubic-bezier(.4,0,.2,1);pointer-events:none;
}
.task:hover .media{border-color:color-mix(in srgb,var(--k) 44%,var(--ink-800));transform:translateY(-1px)}
.play{
  position:absolute;right:8px;bottom:8px;width:24px;height:24px;border-radius:99px;
  background:var(--blue);display:grid;place-items:center;
  box-shadow:0 3px 10px rgba(0,3,5,.55);
}
.play svg{width:9px;height:9px}
.dur{
  position:absolute;left:8px;bottom:8px;font-family:var(--mono);font-size:8.5px;font-weight:600;
  background:rgba(0,3,5,.8);padding:2.5px 5px;border-radius:5px;color:var(--ivory);
  letter-spacing:.04em;backdrop-filter:blur(4px);
}

/* connector hairline */
.link{
  grid-column:2;position:relative;height:100%;display:grid;place-items:center;
}
.link::before{
  content:'';position:absolute;top:50%;right:50%;height:1px;
  width:calc(50% - var(--node)/2 - 3px);
  background:linear-gradient(90deg,transparent,var(--ink-600));
}
/* node */
.node{
  position:relative;z-index:3;width:var(--node);height:var(--node);border-radius:99px;
  background:var(--ink-950);border:2px solid var(--ink-600);
  display:grid;place-items:center;cursor:pointer;flex:none;
  transition:.2s cubic-bezier(.4,0,.2,1);
}
.node svg{width:60%;height:60%;opacity:0;transform:scale(.4);transition:.22s cubic-bezier(.34,1.56,.64,1)}
.node:hover{border-color:var(--blue-400);transform:scale(1.16)}
.task.mile .node{border-color:var(--yellow);box-shadow:0 0 0 3.5px rgba(255,216,16,.13)}
.task.done .node{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,98,232,.16)}
.task.done .node svg{opacity:1;transform:scale(1)}

/* content (RIGHT of the line) */
.cnt{grid-column:3;padding-left:var(--cnt-pad);min-width:0}
.ttl{
  font-size:var(--t-title);font-weight:600;letter-spacing:-.017em;line-height:1.28;
  color:var(--tx-1);transition:font-size .32s cubic-bezier(.4,0,.2,1),color .18s;
  display:block;text-align:left;width:100%;
}
.task:hover .ttl{color:var(--blue-400)}
.task.done .ttl{color:var(--tx-3);text-decoration:line-through;text-decoration-color:var(--tx-4);text-decoration-thickness:1.5px}
.dsc{
  font-size:var(--t-desc);color:var(--tx-3);line-height:1.5;margin-top:4px;max-width:56ch;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.mrow2{display:flex;align-items:center;gap:7px;margin-top:6px;flex-wrap:wrap}
.tag{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
  padding:2.5px 8px;border-radius:6px;letter-spacing:.005em;
  background:color-mix(in srgb,var(--k) 14%,transparent);
  color:color-mix(in srgb,var(--k) 76%,#fff);
  border:1px solid color-mix(in srgb,var(--k) 26%,transparent);
}
.tag s{width:6px;height:6px;border-radius:99px;background:var(--k);display:block;flex:none}
.mini{font-family:var(--mono);font-size:10px;color:var(--tx-4);letter-spacing:.02em}
.mflag{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
  padding:2.5px 8px;border-radius:6px;letter-spacing:.02em;text-transform:uppercase;
  background:rgba(255,216,16,.14);color:var(--yellow);border:1px solid rgba(255,216,16,.3);
}
.acts{display:flex;gap:7px;margin-top:11px}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 15px;border-radius:99px;
  font-size:12.5px;font-weight:600;transition:.15s;
}
.btn.p{background:var(--blue);color:#fff}
.btn.p:hover{background:var(--blue-700)}
.btn.s{background:var(--ink-700);color:var(--tx-2);border:1px solid var(--ink-600)}
.btn.s:hover{background:var(--ink-600);color:#fff}

/* "You are here" marker */
.here{
  display:grid;grid-template-columns:var(--media-w) var(--rail) minmax(0,1fr);
  align-items:center;margin:8px 0 16px;position:relative;
  transition:grid-template-columns .32s cubic-bezier(.4,0,.2,1);
}
.here[hidden]{display:none}
.here .hl{grid-column:1;justify-self:end;width:100%;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--green));border-radius:2px}
.here .hd{grid-column:2;justify-self:center;width:11px;height:11px;border-radius:99px;
  background:var(--green);z-index:4;box-shadow:0 0 0 4px rgba(84,244,184,.18),0 0 0 1px var(--ink-950)}
.here .ht{grid-column:3;padding-left:20px;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--green)}

/* END CAP */
.endcap{
  display:grid;grid-template-columns:var(--media-w) var(--rail) minmax(0,1fr);
  align-items:center;padding-top:22px;
  transition:grid-template-columns .32s cubic-bezier(.4,0,.2,1);
}
.endcap .ec{grid-column:2;justify-self:center;width:34px;height:34px;border-radius:99px;
  background:var(--blue);display:grid;place-items:center;z-index:4;
  box-shadow:0 0 0 6px rgba(47,98,232,.14)}
.endcap .ec svg{width:17px;height:17px}
.endcap .et{grid-column:3;padding-left:20px}
.endcap .et b{display:block;font-size:19px;font-weight:700;letter-spacing:-.024em}
.endcap .et span{display:block;font-size:12.5px;color:var(--tx-3);margin-top:2px}

/* ============================================================
   ZOOM LEVELS — semantic level-of-detail
   ============================================================ */
[data-zoom="0"]{--media-w:52px;--media-h:26px;--rail:40px;--row-gap:0px;--card-r:6px;
  --t-title:12.5px;--node:9px;--shell:700px}
[data-zoom="0"] .dsc,[data-zoom="0"] .mrow2,[data-zoom="0"] .acts,
[data-zoom="0"] .play,[data-zoom="0"] .dur,[data-zoom="0"] .mrow .myear{display:none}
[data-zoom="0"]{--cnt-pad:14px}
[data-zoom="0"] .task{padding:1px 0}
[data-zoom="0"] .ttl{line-height:1.15}
[data-zoom="0"] .hero{padding:26px 0 14px}
[data-zoom="0"] .hero h1{font-size:30px}
[data-zoom="0"] .hero p{display:none}
[data-zoom="0"] .ghead{padding:18px 0 8px}
[data-zoom="0"] .ghead .sub{display:none}
[data-zoom="0"] .here{margin:4px 0 8px}
[data-zoom="0"] .ghead .num{font-size:34px}
[data-zoom="0"] .mrow{padding:6px 0 3px}
[data-zoom="0"] .media::after{opacity:.20}

[data-zoom="1"]{--media-w:148px;--media-h:58px;--rail:52px;--row-gap:5px;--card-r:9px;
  --t-title:13.5px;--node:11px;--shell:840px}
[data-zoom="1"] .dsc,[data-zoom="1"] .acts,[data-zoom="1"] .play,[data-zoom="1"] .dur{display:none}
[data-zoom="1"]{--cnt-pad:16px}
[data-zoom="1"] .mrow2{margin-top:3px}
[data-zoom="1"] .ghead .num{font-size:42px}

[data-zoom="2"]{--media-w:264px;--media-h:106px;--rail:64px;--row-gap:12px;
  --t-title:15.5px;--node:13px;--shell:988px}
[data-zoom="2"] .acts{display:none}

[data-zoom="3"]{--media-w:392px;--media-h:172px;--rail:76px;--row-gap:26px;--card-r:15px;
  --t-title:21px;--t-desc:13.5px;--node:16px;--shell:1180px}
[data-zoom="3"]{--cnt-pad:26px}
[data-zoom="3"] .dsc{-webkit-line-clamp:unset;display:block;overflow:visible;max-width:62ch}

function itemHTML(t){
  const K = KINDS[t.k], P = t.by ? PEOPLE[t.by] : null, A = accentOf(t);
  const cls = ['task', 'k-' + t.k];
  if(t.mi)    cls.push('mile');
  if(P)       cls.push('contrib');
  if(t.fresh) cls.push('fresh');

  /* the rail node: a checkbox for to-dos, a marker for moments */
  const node = K.check
    ? `<button class="node" data-toggle="${t.id}" aria-pressed="false"
         aria-label="Mark complete: ${esc(t.t)}">${CHECK}</button>`
    : `<span class="node ${t.k === 'kudos' ? 'kd' : 'ev'}" aria-hidden="true">${t.k === 'kudos' ? ICON.star : ICON.diam}</span>`;

  /* who put this here */
  const attrib = P ? `<div class="attrib">
      <span class="av">${P.i}</span>
      <b>${P.n}</b><span class="role">${P.r}</span>
      <span class="kpill">${K.n}</span>
      ${t.ago ? `<span class="ago">${t.ago}</span>` : ''}
      ${t.fresh ? '<span class="newdot">New</span>' : ''}
    </div>` : '';

  /* the meta line says something different for each kind */
  let meta = '';
  if(t.k === 'task'){
    const C = CATS[t.c];
    meta = `${t.mi ? '<span class="mflag">Key deadline</span>' : ''}
      <span class="tag"><s></s>${C.n}</span>
      <span class="mini">${MFULL[t.m]} · Grade ${t.g}</span><span class="mini">·</span><span class="mini">${t.x}</span>`;
  } else if(t.k === 'assign'){
    meta = `<span class="due">${t.due}</span>
      ${t.note ? `<span class="mini">${t.note}</span>` : ''}
      <span class="mini">·</span><span class="mini">${t.x}</span>`;
  } else if(t.k === 'event'){
    meta = `<span class="when">${ICON.clock}${t.when}</span>
      ${t.where ? `<span class="where">${ICON.pin}${t.where}</span>` : ''}
      ${t.note ? `<span class="mini">${t.note}</span>` : ''}`;
  }

  /* actions differ too: you don't "start" a career fair */
  let acts = '';
  if(K.check){
    acts = `<button class="btn p">${t.k === 'assign' ? 'Open assignment' : 'Start this task'}</button>
            <button class="btn s ico" data-save="${t.id}" aria-pressed="false"
              title="Save for later" aria-label="Save for later: ${esc(t.t)}">${BOOKMARK}</button>`;
  } else if(t.k === 'event'){
    acts = `<button class="btn p" data-rsvp="${t.id}">Going</button>
            <button class="btn s" data-rsvp-no="${t.id}">Can't make it</button>`;
  } else {
    acts = `<button class="btn s" data-thx="${t.id}">${ICON.heart} Say thanks</button>`;
  }

  return `<article class="${cls.join(' ')}" data-id="${t.id}" data-cat="${t.c || ''}"
      data-by="${t.by || 'levelall'}" style="--k:${A}">
    <div class="media">${plate(t.a, A, t.v)}
      ${t.v ? `<span class="play">${PLAY}</span>` : ''}
      ${t.x ? `<span class="dur">${t.x}</span>` : ''}
    </div>
    <div class="link">${node}</div>
    <div class="cnt">
      ${attrib}
      ${K.check ? `<button class="ttl" data-toggle="${t.id}">${t.t}</button>`
                : `<span class="ttl as-text">${t.t}</span>`}
      <p class="dsc">${t.d}</p>
      ${meta ? `<div class="mrow2">${meta}</div>` : ''}
      <div class="acts">${acts}</div>
      <span class="state" data-state="${t.id}"></span>
    </div>
  </article>`;
}

function buildTimeline(){
  let html = '';
  GRADES.forEach(G => {
    const list  = ITEMS.filter(t => t.g === G.g);
    const todos = list.filter(t => KINDS[t.k].check).length;
    html += `<section class="grade" id="grade-${G.g}" data-g="${G.g}">
      <div class="ghead">
        <div class="num">${G.g}</div><div class="rl"></div>
        <div class="txt">

    });
    html += `</div></section>`;
  });

  html += `<div class="endcap"><div class="ec"><svg viewBox="0 0 24 24" fill="none" stroke="#000305" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="M7 10.5V16c0 1.7 2.2 3 5 3s5-1.3 5-3v-5.5"/></svg></div>
    <div class="et"><b>Move-in day</b><span>Four years, ${CHECKABLE.length} things to do, and four people who helped you get there.</span></div></div>`;

  document.getElementById('tl').innerHTML = html;
}

/* ============================================================
   5. STATE / INTERACTION
   ============================================================ */
function save(){
  try{
    localStorage.setItem('la-journey-done',  JSON.stringify([...state.done]));
    localStorage.setItem('la-journey-saved', JSON.stringify([...state.saved]));
    localStorage.setItem('la-journey-zoom', String(state.zoom));
  }catch(e){}
}

function paintRails(){
  document.querySelectorAll('.grade .body').forEach(body=>{
    const fill = body.querySelector('.railfill');
    if(!fill) return;
    const done  = [...body.querySelectorAll('.task.done:not(.hidden)')];
    const todo  = [...body.querySelectorAll('.task:not(.hidden)')]
                    .filter(t => t.querySelector('.node[data-toggle]'));
    if(!done.length){ fill.style.height = '0px'; return; }
    if(done.length === todo.length){ fill.style.height = body.offsetHeight + 'px'; return; }
    const node = done[done.length-1].querySelector('.node');
    const top  = body.getBoundingClientRect().top;
    const r    = node.getBoundingClientRect();
    fill.style.height = Math.max(0, (r.top + r.height/2) - top) + 'px';
  });
}

function refreshProgress(){
  const tot = CHECKABLE.length, n = state.done.size;
  const pct = tot ? n/tot : 0;
  const C = 2*Math.PI*16.5;
  const ring = document.getElementById('ring');
  ring.setAttribute('stroke-dasharray', C.toFixed(1));
  ring.setAttribute('stroke-dashoffset', (C*(1-pct)).toFixed(1));
  document.getElementById('pnum').textContent = Math.round(pct*100)+'%';
  document.getElementById('pcnt').textContent = `${n} of ${tot}`;

  GRADES.forEach(G=>{
    const list = CHECKABLE.filter(t=>t.g===G.g);
    const d = list.filter(t=>state.done.has(t.id)).length;
    const p = list.length ? d/list.length : 0;
    const f = document.querySelector(`[data-gfill="${G.g}"]`); if(f) f.style.width = (p*100)+'%';
    const x = document.querySelector(`[data-gpct="${G.g}"]`);  if(x) x.textContent = `${d} / ${list.length}`;
    const nb= document.querySelector(`[data-npct="${G.g}"]`);  if(nb) nb.textContent = Math.round(p*100)+'%';
  });
}

function toggle(id){
  const el = document.querySelector(`.task[data-id="${id}"]`);
  if(!el) return;
  if(state.done.has(id)) state.done.delete(id); else state.done.add(id);
  const on = state.done.has(id);
  el.classList.toggle('done', on);
  el.querySelectorAll('.node').forEach(n=>n.setAttribute('aria-pressed', on));
  refreshProgress(); paintRails(); save();
}

/* ---------- ZOOM (semantic level of detail) ---------- */
const ZNAMES = ['Overview','Compact','Normal','Detail'];
function anchorTask(){
  // the task nearest the top of the viewport, so zoom feels anchored
  const els = [...document.querySelectorAll('.task:not(.hidden)')];
  const top = 130;
  let best = null, bd = 1e9;
  for(const e of els){
    const r = e.getBoundingClientRect();
    const d = Math.abs(r.top - top);
    if(r.bottom > 0 && d < bd){ bd = d; best = e; }
  }
  return best ? {el:best, off:best.getBoundingClientRect().top} : null;
}
let zTick = 0;
function setZoom(z, anim){
  z = Math.max(0, Math.min(3, z));
  if(z === state.zoom) return;
  const a = anchorTask();
  state.zoom = z;
  document.documentElement.dataset.zoom = z;
  document.getElementById('zname').textContent = ZNAMES[z];
  document.getElementById('zin').disabled  = z===3;
  document.getElementById('zout').disabled = z===0;
  document.querySelectorAll('#stops i').forEach((s,i)=>{
    s.className = i===z ? 'on' : (i<z ? 'pas' : '');
  });
  save();
  if(a){
    // Hold the anchored task pinned for the whole 320ms layout transition, so
    // everything grows/shrinks *around* wherever you were looking.
    const t0 = performance.now();
    const me = ++zTick;                    // rapid clicks: newest correction wins
    const tick = () => {
      if(me !== zTick) return;
      const d = a.el.getBoundingClientRect().top - a.off;
      if(Math.abs(d) > 0.5) window.scrollBy(0, d);
      paintRails();
      if(performance.now() - t0 < 440) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
}

function applyFilters(){
  const f = state.filters, ppl = state.people;
  document.querySelectorAll('.task').forEach(el=>{
    const okCat = f.size===0   || f.has(el.dataset.cat);
    const okWho = ppl.size===0 || ppl.has(el.dataset.by);
    el.classList.toggle('hidden', !(okCat && okWho));
  });
  // collapse month rows and grade sections that emptied out
  document.querySelectorAll('.grade').forEach(sec=>{
    let vis = 0, cur = null, curCount = 0;
    [...sec.querySelector('.body').children].forEach(ch=>{
      if(ch.classList.contains('mrow')){
        if(cur) cur.style.display = curCount ? '' : 'none';
        cur = ch; curCount = 0;
      } else if(ch.classList.contains('task') && !ch.classList.contains('hidden')){
        curCount++; vis++;
      }
    });
    if(cur) cur.style.display = curCount ? '' : 'none';
    sec.style.display = vis ? '' : 'none';
  });
  document.querySelectorAll('.ddopt[data-cat]').forEach(c=>{
    const on = f.has(c.dataset.cat);
    c.classList.toggle('on', on);
    c.setAttribute('aria-checked', on);
  });
  const badge = document.getElementById('ddcount');
  badge.hidden = f.size === 0;
  badge.textContent = f.size;
  document.getElementById('ddbtn').classList.toggle('active', f.size>0);
  document.querySelectorAll('.face').forEach(c=>{
    c.classList.toggle('on', ppl.has(c.dataset.person));
    c.classList.toggle('off', ppl.size>0 && !ppl.has(c.dataset.person));
  });
  document.querySelector('.ddclear').disabled = (f.size===0 && ppl.size===0);
  paintRails();
}

const BASE_YEAR = 2026;   // August of the selected grade's school year
function stampYears(sg){
  document.querySelectorAll('[data-yr]').forEach(el=>{
    const g = +el.dataset.yr, m = el.dataset.mo;
    const start = BASE_YEAR + (g - sg);
    el.textContent = MFULL[m] + ' ' + (MONTHS.indexOf(m) <= 4 ? start : start + 1);
  });
}
function setHere(g){
  state.grade = g;
  stampYears(g);
  document.querySelectorAll('[data-here]').forEach(el=>{
    el.hidden = (+el.dataset.here !== g);
  });
}

buildNav(); buildLegend(); buildTimeline(); buildInbox();

document.getElementById('stops').innerHTML = ZNAMES.map((n,i)=>`<i data-z="${i}" title="${n}"></i>`).join('');
document.documentElement.dataset.zoom = state.zoom;
document.getElementById('zname').textContent = ZNAMES[state.zoom];
document.getElementById('zin').disabled = state.zoom===3;
document.getElementById('zout').disabled = state.zoom===0;
document.querySelectorAll('#stops i').forEach((s,i)=>{ s.className = i===state.zoom?'on':(i<state.zoom?'pas':''); });


// restore completed state onto DOM
state.saved.forEach(id=>{
  const b = document.querySelector(`[data-save="${id}"]`);
  if(b){ b.setAttribute('aria-pressed','true'); b.title='Saved'; }
});
state.done.forEach(id=>{
  const el = document.querySelector(`.task[data-id="${id}"]`);
  if(el){ el.classList.add('done'); el.querySelectorAll('.node').forEach(n=>n.setAttribute('aria-pressed','true')); }
});
refreshProgress();
paintRails();
addEventListener('resize', paintRails);
setHere(state.grade);   // 11th grade unless a #g11-style deep link says otherwise

/* events */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-toggle]');   if(t){ toggle(t.dataset.toggle); return; }
  const j = e.target.closest('[data-jump]');     if(j){ document.getElementById('grade-'+j.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const z = e.target.closest('#stops i');        if(z){ setZoom(+z.dataset.z); return; }
  const c = e.target.closest('.ddopt[data-cat]'); if(c){ state.filters.has(c.dataset.cat)?state.filters.delete(c.dataset.cat):state.filters.add(c.dataset.cat); applyFilters(); return; }
  if(e.target.closest('#ddbtn')){ setDD(document.getElementById('ddmenu').hidden); return; }
  if(!e.target.closest('#catdd')) setDD(false);
  const f = e.target.closest('.face[data-person]');
  if(f){ const k=f.dataset.person; state.people.has(k)?state.people.delete(k):state.people.add(k); applyFilters(); return; }
  if(e.target.closest('[data-reset]')){ state.filters.clear(); state.people.clear(); applyFilters(); return; }

  const gt = e.target.closest('[data-goto]');   if(gt){ jumpTo(gt.dataset.goto); return; }
  const ry = e.target.closest('[data-rsvp]');   if(ry){ setRsvp(ry.dataset.rsvp,'yes'); return; }
  const rn = e.target.closest('[data-rsvp-no]');if(rn){ setRsvp(rn.dataset.rsvpNo,'no'); return; }
  const th = e.target.closest('[data-thx]');    if(th){ toggleThanks(th.dataset.thx); return; }
  const sv = e.target.closest('[data-save]');   if(sv){ toggleSave(sv.dataset.save); return; }
});
function jumpTo(id){
  const el = document.querySelector(`.task[data-id="${id}"]`);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.remove('flash');
  void el.offsetWidth;               // restart the animation
  el.classList.add('flash');
}
function setRsvp(id, v){
  const el = document.querySelector(`.task[data-id="${id}"]`);
  if(state.rsvp.get(id) === v) state.rsvp.delete(id); else state.rsvp.set(id, v);
  const cur = state.rsvp.get(id);
  const chip = el.querySelector('[data-state]');
  chip.className = 'state' + (cur ? ' on' : '');
  chip.textContent = cur === 'yes' ? "You're going" : cur === 'no' ? "You said you can't make it" : '';
  el.querySelectorAll('.acts .btn').forEach(b=>b.style.opacity = cur ? .55 : 1);
}
function toggleSave(id){
  const on = !state.saved.has(id);
  on ? state.saved.add(id) : state.saved.delete(id);
  const b = document.querySelector(`[data-save="${id}"]`);
  b.setAttribute('aria-pressed', on);
  b.title = on ? 'Saved' : 'Save for later';
  save();
}
function toggleThanks(id){
  const el = document.querySelector(`.task[data-id="${id}"]`);
  const on = !state.thanks.has(id);
  on ? state.thanks.add(id) : state.thanks.delete(id);
  const chip = el.querySelector('[data-state]');
  chip.className = 'state' + (on ? ' on' : '');
  chip.textContent = on ? 'Thanks sent to ' + PEOPLE[ITEMS.find(t=>t.id===id).by].n : '';
  el.querySelector('[data-thx]').style.opacity = on ? .55 : 1;
}

document.getElementById('zin').addEventListener('click',()=>setZoom(state.zoom+1));
document.getElementById('zout').addEventListener('click',()=>setZoom(state.zoom-1));

/* keyboard */
addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea,select')) return;
  if(e.key==='+'||e.key==='='){ e.preventDefault(); setZoom(state.zoom+1); }
  if(e.key==='-'||e.key==='_'){ e.preventDefault(); setZoom(state.zoom-1); }
  if(e.key==='0'){ e.preventDefault(); setZoom(2); }
  if(e.key==='Escape'){ setDD(false); }
});
/* ctrl/⌘ + wheel  (also captures trackpad pinch) */
let wl = 0;
addEventListener('wheel', e=>{
  if(!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const now = performance.now();
  if(now - wl < 260) return;
  wl = now;
  setZoom(state.zoom + (e.deltaY < 0 ? 1 : -1));
}, {passive:false});

/* scroll-spy on the grade nav */
const nav = document.getElementById('gnav');
const io = new IntersectionObserver(es=>{
  es.forEach(en=>{
    if(en.isIntersecting){
      nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.jump===en.target.dataset.g));
    }
  });
},{rootMargin:'-118px 0px -70% 0px'});
document.querySelectorAll('.grade').forEach(s=>io.observe(s));
</script>
