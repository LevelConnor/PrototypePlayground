    // document mints the blobs for its OWN frames, obtaining page text

    // its direct parent (which, for every document the publisher's own

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        UUID_SHAPE.test(d.__bundler_page) &&

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e3425892-475f-46b2-bfcc-ab017198084e\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<style>\n@font-face { font-family:\"Graphik\"; src:url(\"e2b7ee37-b81b-4e74-a091-70cbb272b527\") format(\"opentype\"); font-weight:400; font-style:normal; font-display:swap; }\n@font-face { font-family:\"Graphik\"; src:url(\"17cd453b-cb03-44ee-bf54-840ba78b07b1\") format(\"opentype\"); font-weight:500; font-style:normal; font-display:swap; }\n@font-face { font-family:\"Graphik\"; src:url(\"01dcb4ad-e752-49f1-a656-bea4051f90b2\") format(\"opentype\"); font-weight:600; font-style:normal; font-display:swap; }\n@font-face { font-family:\"Graphik\"; src:url(\"01dcb4ad-e752-49f1-a656-bea4051f90b2\") format(\"opentype\"); font-weight:700; font-style:normal; font-display:swap; }\nhtml { scroll-behavior:smooth; }\n:root {\n  --ap-bg:#00173B; --ap-card:#172554; --ap-border:#213168; --ap-border-strong:#2563EB;\n  --ap-fg:#FFFFFF; --ap-muted:#93C5FD; --ap-subtle:#64748B; --ap-link:#60A5FA;\n  --ap-mint:#68F4B8; --ap-warn:#68F4B8; --ap-warn-bg:rgba(104,244,184,0.12);\n  --ap-rail:rgba(0,23,59,0.92); --ap-hover:#0F1E45; --ap-logo:#0083FF; --ap-task-bg:oklch(0.62 0.16 163 / 0.12);\n}\n[data-la-theme=\"light\"], html:has([data-la-theme=\"light\"]) {\n  --ap-bg:#EFF6FF; --ap-card:#FFFFFF; --ap-border:#BFDBFE; --ap-border-strong:#93C5FD;\n  --ap-fg:#00173B; --ap-muted:#475569; --ap-subtle:#64748B; --ap-link:#145AED;\n  --ap-mint:#145AED; --ap-warn:oklch(0.62 0.16 163); --ap-warn-bg:oklch(0.62 0.16 163 / 0.14);\n  --ap-rail:rgba(239,246,255,0.92); --ap-hover:#DBEAFE; --ap-logo:#0083FF; --ap-task-bg:oklch(0.62 0.16 163 / 0.12);\n}\nbody { margin:0; background:var(--ap-bg); color:var(--ap-fg); font-family:\"Graphik\", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }\na { color:var(--ap-link); text-decoration:none; }\na:hover { color:var(--ap-link); text-decoration:underline; }\nsummary::-webkit-details-marker { display:none; }\n@keyframes fade { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }\n@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-la-theme=\"{{ theme }}\" style=\"min-height:100vh; background:var(--ap-bg); color:var(--ap-fg); font-family:'Graphik', system-ui, sans-serif; line-height:1.5;\">\n\n  <div style=\"position:sticky; top:0; z-index:40; background:var(--ap-rail); backdrop-filter:blur(12px); border-bottom:1px solid var(--ap-border);\">\n    <div style=\"max-width:900px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:20px;\">\n      <div style=\"display:flex; align-items:center; gap:8px; white-space:nowrap;\">\n        <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\" style=\"color:var(--ap-logo); flex-shrink:0;\">\n          <g fill=\"currentColor\" fill-rule=\"evenodd\">\n            <path d=\"M8.36 0 L8.36 3.392 L19.962 3.392 L19.962 15.343 L23.355 15.343 L23.355 0 L8.36 0 Z\"><\u002Fpath>\n            <path d=\"M0 8.357 L0 11.749 L11.602 11.749 L11.602 23.7 L14.996 23.7 L14.996 8.357 L0 8.357 Z\"><\u002Fpath>\n          <\u002Fg>\n        <\u002Fsvg>\n        <span style=\"font-size:17px; font-weight:700; letter-spacing:-0.02em; color:var(--ap-fg);\">Level All FAFSA<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:6px; flex:1;\">\n        <sc-for list=\"{{ pips }}\" as=\"pip\" hint-placeholder-count=\"3\">\n          <div style=\"height:4px; flex:1; background:var(--ap-border); border-radius:9999px; overflow:hidden;\">\n            <sc-if value=\"{{ pip.done }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"height:100%; width:100%; background:#0083FF;\"><\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ pip.active }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"height:100%; width:50%; background:#0083FF;\"><\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:12px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--ap-muted); white-space:nowrap;\">{{ stepLabel }}<\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"Toggle light and dark mode\" title=\"Toggle light and dark mode\" style=\"display:flex; align-items:center; justify-content:center; width:36px; height:36px; flex-shrink:0; border-radius:9999px; background:transparent; border:1px solid var(--ap-border); color:var(--ap-muted); cursor:pointer; transition:border-color .15s ease-out, color .15s ease-out;\" style-hover=\"border-color:var(--ap-border-strong); color:var(--ap-fg)\" style-active=\"transform:scale(0.98)\">\n        <sc-if value=\"{{ isDark }}\" hint-placeholder-val=\"{{ true }}\">\n          <svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\">\n            <defs>\n              <mask id=\"ap-moon-mask\">\n                <rect width=\"24\" height=\"24\" fill=\"black\"><\u002Frect>\n                <circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"white\"><\u002Fcircle>\n                <circle cx=\"18.6\" cy=\"7.6\" r=\"8.2\" fill=\"black\"><\u002Fcircle>\n              <\u002Fmask>\n              <radialGradient id=\"ap-moon-fill\" cx=\"35%\" cy=\"35%\" r=\"80%\">\n                <stop offset=\"0%\" stop-color=\"#DBEAFE\"><\u002Fstop>\n                <stop offset=\"100%\" stop-color=\"#93C5FD\"><\u002Fstop>\n              <\u002FradialGradient>\n            <\u002Fdefs>\n            <g mask=\"url(#ap-moon-mask)\">\n              <circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"url(#ap-moon-fill)\"><\u002Fcircle>\n              <circle cx=\"8.6\" cy=\"14.6\" r=\"1.7\" fill=\"#60A5FA\" opacity=\"0.55\"><\u002Fcircle>\n              <circle cx=\"7.4\" cy=\"9.8\" r=\"1.05\" fill=\"#60A5FA\" opacity=\"0.45\"><\u002Fcircle>\n              <circle cx=\"11.4\" cy=\"17.8\" r=\"0.8\" fill=\"#60A5FA\" opacity=\"0.4\"><\u002Fcircle>\n            <\u002Fg>\n          <\u002Fsvg>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isLight }}\" hint-placeholder-val=\"{{ false }}\">\n          <svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\">\n            <defs>\n              <radialGradient id=\"ap-sun-fill\" cx=\"38%\" cy=\"34%\" r=\"75%\">\n                <stop offset=\"0%\" stop-color=\"#FFD810\"><\u002Fstop>\n                <stop offset=\"100%\" stop-color=\"#F97316\"><\u002Fstop>\n              <\u002FradialGradient>\n            <\u002Fdefs>\n            <g stroke=\"#F97316\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.9\">\n              <path d=\"M12 1.6v3.1M12 19.3v3.1M22.4 12h-3.1M4.7 12H1.6M19.35 4.65l-2.2 2.2M6.85 17.15l-2.2 2.2M19.35 19.35l-2.2-2.2M6.85 6.85l-2.2-2.2\"><\u002Fpath>\n            <\u002Fg>\n            <circle cx=\"12\" cy=\"12\" r=\"6\" fill=\"url(#ap-sun-fill)\"><\u002Fcircle>\n            <circle cx=\"9.9\" cy=\"9.9\" r=\"1.9\" fill=\"#FFFFFF\" opacity=\"0.45\"><\u002Fcircle>\n          <\u002Fsvg>\n        <\u002Fsc-if>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <main style=\"max-width:900px; margin:0 auto; padding:0 24px 120px;\">\n\n    <sc-if value=\"{{ isHero }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"padding:80px 0 40px; animation:fade .45s ease;\">\n        <div style=\"font-family:'Geist Mono', ui-monospace, monospace; font-size:12px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--ap-mint); margin-bottom:24px;\">Free federal aid, actually claimed<\u002Fdiv>\n        <h1 style=\"margin:0; font-size:clamp(40px, 7vw, 68px); line-height:1.03; font-weight:700; letter-spacing:-0.025em; color:var(--ap-fg);\">The form is free.<br>The <span style=\"color:#0083FF;\">money<\u002Fspan> is real.<br>Let's go get it!<\u002Fh1>\n        <p style=\"font-size:20px; line-height:1.5; max-width:30em; margin:28px 0 36px; color:var(--ap-muted);\">Most people don't lose aid on the math. They lose it to the wrong parent's tax return, a missed state deadline, or a verification letter nobody explained. Level All FAFSA walks you through your situation, not a generic one.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ goTriage }}\" style=\"font-family:inherit; font-size:15px; font-weight:600; background:#0083FF; color:#FFFFFF; border:none; padding:14px 28px; border-radius:8px; cursor:pointer; transition:background .15s ease-out, transform .1s;\" style-hover=\"background:#1A8FFF\" style-active=\"background:#0072E0; transform:scale(0.98)\">Build my plan →<\u002Fbutton>\n        <div style=\"display:flex; gap:14px; align-items:flex-start; max-width:34em; margin-top:28px; background:var(--ap-warn-bg); border-left:3px solid var(--ap-warn); border-radius:8px; padding:16px 18px;\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--ap-warn)\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0; margin-top:2px;\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><path d=\"M12 14v4M10 16h4\"><\u002Fpath><\u002Fsvg>\n          <div>\n            <div style=\"font-size:17px; font-weight:600;\">The FAFSA opens October 1. Be ready!<\u002Fdiv>\n            <div style=\"font-size:14px; color:var(--ap-muted); margin-top:4px;\">Some aid is first-come, first-served. State grants, institutional grants, and work-study run out, and they're awarded in the order applications arrive. Two students with identical finances can get different amounts because one filed in October and one filed in March.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:13px; color:var(--ap-subtle); margin:18px 0 0;\">Takes about 3 minutes. Nothing is submitted or stored anywhere. You still file the real FAFSA free at studentaid.gov.<\u002Fp>\n\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-top:56px;\">\n          <div style=\"background:linear-gradient(115deg, var(--ap-card) 0% 40%, #0083FF 190%); border:1px solid var(--ap-border); border-radius:16px; padding:20px 22px;\">\n            <div style=\"font-size:30px; line-height:1.1; font-weight:700; letter-spacing:-0.03em; color:var(--ap-link);\">It's not just for federal aid<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.45; color:var(--ap-muted); margin-top:8px;\">The FAFSA also unlocks direct aid from states, colleges, and private institutions. Even if you don't think you qualify for government aid, file it.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:linear-gradient(115deg, var(--ap-card) 0% 40%, var(--ap-warn) 190%); border:1px solid var(--ap-border); border-radius:16px; padding:20px 22px;\">\n            <div style=\"font-size:40px; font-weight:700; letter-spacing:-0.03em; color:var(--ap-warn); font-size:30px; line-height:1.1;\">Over $3 billion<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.45; color:var(--ap-muted); margin-top:8px;\">in FAFSA money went unclaimed last year. That's real money students left behind.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:linear-gradient(115deg, var(--ap-card) 0% 40%, var(--ap-mint) 190%); border:1px solid var(--ap-border); border-radius:16px; padding:20px 22px;\">\n            <div style=\"font-size:30px; line-height:1.1; font-weight:700; letter-spacing:-0.03em; color:var(--ap-mint);\">Didn't file<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.45; color:var(--ap-muted); margin-top:8px;\">is the number one reason holding people back from financial aid. Nearly 25% of adults said they struggled to complete the FAFSA. Level All FAFSA is built to get you the money you deserve. Hassle free.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTriage }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"animation:fade .45s ease; padding-top:48px;\">\n        <div style=\"font-family:'Geist Mono', ui-monospace, monospace; font-size:12px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--ap-mint); margin-bottom:12px;\">Step one · Your situation<\u002Fdiv>\n        <h2 style=\"margin:0; font-size:clamp(28px, 4.5vw, 40px); font-weight:700; letter-spacing:-0.02em;\">Four questions decide everything.<\u002Fh2>\n        <p style=\"font-size:17px; color:var(--ap-muted); margin:12px 0 0; max-width:34em;\">Who counts as a \"parent,\" which documents you need, and which deadlines bind you all flow from these. Answer honestly; there are no wrong lives here.<\u002Fp>\n\n        <div style=\"margin:34px 0;\">\n          <div style=\"font-size:21px; font-weight:600; margin-bottom:4px;\">First, are you a dependent? Answer these and we'll settle it.<\u002Fdiv>\n          <div style=\"font-size:13.5px; color:var(--ap-subtle); margin-bottom:16px;\">These are the actual FAFSA questions. A single \"yes\" makes you independent. No guessing.<\u002Fdiv>\n          <div style=\"background:var(--ap-card); border:1px solid var(--ap-border); border-radius:16px; overflow:hidden;\">\n            <sc-for list=\"{{ screenerRows }}\" as=\"row\" hint-placeholder-count=\"8\">\n              <div style=\"display:flex; align-items:center; gap:14px; padding:14px 18px; border-top:1px solid var(--ap-border);\">\n                <div style=\"flex:1; font-size:14.5px;\">{{ row.q }}<\u002Fdiv>\n                <div style=\"display:flex; gap:6px; flex-shrink:0;\">\n                  <sc-if value=\"{{ row.yesSel }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ row.setYes }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:#0083FF; color:#FFFFFF; border:1px solid #0083FF; padding:7px 16px; border-radius:6px; cursor:pointer;\">Yes<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ row.yesOff }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ row.setYes }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:transparent; color:var(--ap-muted); border:1px solid var(--ap-border); padding:7px 16px; border-radius:6px; cursor:pointer; transition:border-color .15s;\" style-hover=\"border-color:var(--ap-border-strong)\">Yes<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ row.noSel }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ row.setNo }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:#0083FF; color:#FFFFFF; border:1px solid #0083FF; padding:7px 16px; border-radius:6px; cursor:pointer;\">No<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ row.noOff }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ row.setNo }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:transparent; color:var(--ap-muted); border:1px solid var(--ap-border); padding:7px 16px; border-radius:6px; cursor:pointer; transition:border-color .15s;\" style-hover=\"border-color:var(--ap-border-strong)\">No<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ isIndependent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px; padding:18px 20px; border-radius:12px; background:var(--ap-card); border-left:4px solid var(--ap-mint);\">\n              <div style=\"font-family:'Geist Mono', ui-monospace, monospace; font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--ap-mint); margin-bottom:6px;\">Settled<\u002Fdiv>\n              <p style=\"margin:0; font-size:16px;\">You're an <strong style=\"color:var(--ap-mint);\">independent student<\u002Fstrong>. You report only your own info; no parent data required. Your form is shorter than most.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isDependent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px; padding:18px 20px; border-radius:12px; background:var(--ap-card); border-left:4px solid var(--ap-warn);\">\n              <div style=\"font-family:'Geist Mono', ui-monospace, monospace; font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--ap-warn); margin-bottom:6px;\">Settled<\u002Fdiv>\n              <p style=\"margin:0; font-size:16px;\">You're a <strong style=\"color:var(--ap-warn);\">dependent student<\u002Fstrong>. That means a parent is a \"contributor\" who needs their own account to sign. It's where families get stuck, so we've front-loaded it.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasVerdict }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin:34px 0;\">\n            <div style=\"font-size:21px; font-weight:600; margin-bottom:4px;\">Now, whose tax info does your form use?<\u002Fdiv>\n            <div style=\"font-size:13.5px; color:var(--ap-subtle); margin-bottom:16px;\">This follows straight from your status above. We'll resolve the exact people, no guessing.<\u002Fdiv>\n\n            <sc-for list=\"{{ branchRows }}\" as=\"brow\" hint-placeholder-count=\"1\">\n              <div style=\"margin-top:20px;\">\n                <div style=\"font-size:16px; font-weight:500; margin-bottom:4px;\">{{ brow.label }}<\u002Fdiv>\n                <div style=\"font-size:13.5px; color:var(--ap-subtle); margin-bottom:10px;\">{{ brow.hint }}<\u002Fdiv>\n                <div style=\"display:flex; gap:6px; flex-wrap:wrap;\">\n                  <sc-for list=\"{{ brow.opts }}\" as=\"opt\" hint-placeholder-count=\"2\">\n                    <sc-if value=\"{{ opt.sel }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ opt.pick }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:#0083FF; color:#FFFFFF; border:1px solid #0083FF; padding:8px 18px; border-radius:6px; cursor:pointer;\">{{ opt.t }}<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ opt.off }}\" hint-placeholder-val=\"{{ true }}\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ opt.pick }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:transparent; color:var(--ap-muted); border:1px solid var(--ap-border); padding:8px 18px; border-radius:6px; cursor:pointer; transition:border-color .15s;\" style-hover=\"border-color:var(--ap-border-strong)\">{{ opt.t }}<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ showFiling }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:28px;\">\n                <div style=\"font-size:21px; font-weight:600; margin-bottom:4px;\">Did each person file a U.S. tax return?<\u002Fdiv>\n                <div style=\"font-size:13.5px; color:var(--ap-subtle); margin-bottom:16px;\">Filers use the automatic IRS transfer. Non-filers still consent, then confirm they didn't file. Everyone must consent either way.<\u002Fdiv>\n                <div style=\"background:var(--ap-card); border:1px solid var(--ap-border); border-radius:16px; overflow:hidden;\">\n                  <sc-for list=\"{{ filingRows }}\" as=\"frow\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex; align-items:center; gap:14px; padding:14px 18px; border-top:1px solid var(--ap-border);\">\n                      <div style=\"flex:1; font-size:14.5px;\">{{ frow.role }}<\u002Fdiv>\n                      <div style=\"display:flex; gap:6px; flex-shrink:0;\">\n                        <sc-if value=\"{{ frow.filedSel }}\" hint-placeholder-val=\"{{ false }}\">\n                          <button type=\"button\" sc-camel-on-click=\"{{ frow.setFiled }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:#0083FF; color:#FFFFFF; border:1px solid #0083FF; padding:7px 16px; border-radius:6px; cursor:pointer;\">Filed<\u002Fbutton>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ frow.filedOff }}\" hint-placeholder-val=\"{{ true }}\">\n                          <button type=\"button\" sc-camel-on-click=\"{{ frow.setFiled }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:transparent; color:var(--ap-muted); border:1px solid var(--ap-border); padding:7px 16px; border-radius:6px; cursor:pointer; transition:border-color .15s;\" style-hover=\"border-color:var(--ap-border-strong)\">Filed<\u002Fbutton>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ frow.noneSel }}\" hint-placeholder-val=\"{{ false }}\">\n                          <button type=\"button\" sc-camel-on-click=\"{{ frow.setNone }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:#0083FF; color:#FFFFFF; border:1px solid #0083FF; padding:7px 16px; border-radius:6px; cursor:pointer;\">Didn't file<\u002Fbutton>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ frow.noneOff }}\" hint-placeholder-val=\"{{ true }}\">\n                          <button type=\"button\" sc-camel-on-click=\"{{ frow.setNone }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:transparent; color:var(--ap-muted); border:1px solid var(--ap-border); padding:7px 16px; border-radius:6px; cursor:pointer; transition:border-color .15s;\" style-hover=\"border-color:var(--ap-border-strong)\">Didn't file<\u002Fbutton>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ rosterSettled }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:16px; padding:18px 20px; border-radius:12px; background:var(--ap-card); border-left:4px solid #0083FF;\">\n                <div style=\"font-family:'Geist Mono', ui-monospace, monospace; font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--ap-link); margin-bottom:6px;\">Settled · who's on your form<\u002Fdiv>\n                <p style=\"margin:0; font-size:16px;\">Your contributors: <strong style=\"color:var(--ap-link);\">{{ rosterNames }}<\u002Fstrong>. Each one needs their own account and must consent to the IRS data pull. {{ rosterTail }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex; justify-content:space-between; align-items:center; margin-top:40px; gap:16px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ goHero }}\" style=\"font-family:inherit; background:none; border:none; color:var(--ap-link); cursor:pointer; font-size:14px; padding:8px 0;\" style-hover=\"text-decoration:underline\">← Back<\u002Fbutton>\n          <sc-if value=\"{{ canContinue }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ buildPlan }}\" style=\"font-family:inherit; font-size:15px; font-weight:600; background:#0083FF; color:#FFFFFF; border:none; padding:14px 28px; border-radius:8px; cursor:pointer;\" style-hover=\"background:#1A8FFF\" style-active=\"background:#0072E0; transform:scale(0.98)\">See my plan →<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ cantContinue }}\" hint-placeholder-val=\"{{ true }}\">\n            <button type=\"button\" disabled=\"{{ true }}\" style=\"font-family:inherit; font-size:15px; font-weight:600; background:var(--ap-border); color:var(--ap-subtle); border:none; padding:14px 28px; border-radius:8px; cursor:not-allowed;\">See my plan →<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPlan }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"animation:fade .45s ease; padding-top:48px;\">\n        <div style=\"font-family:'Geist Mono', ui-monospace, monospace; font-size:12px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--ap-mint); margin-bottom:12px;\">Step two · Your plan<\u002Fdiv>\n        <h2 style=\"margin:0; font-size:clamp(28px, 4.5vw, 40px); font-weight:700; letter-spacing:-0.02em;\">Here's your path.<\u002Fh2>\n        <p style=\"font-size:17px; color:var(--ap-muted); margin:12px 0 0; max-width:34em;\">Everything below is tuned to what you told us.<\u002Fp>\n\n        <div style=\"background:linear-gradient(115deg, var(--ap-card) 0% 45%, #0083FF 200%); border:1px solid var(--ap-border); border-radius:16px; padding:24px 26px; margin:24px 0 8px;\">\n          <div style=\"font-family:'Geist Mono', ui-monospace, monospace; font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--ap-warn); margin-bottom:8px;\">The headline<\u002Fdiv>\n          <sc-if value=\"{{ isDependent }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0; font-size:16px;\">You're a <strong style=\"color:var(--ap-warn);\">dependent student<\u002Fstrong>, so a parent-contributor needs their own account to sign your form. That's where most families get stuck, so we've front-loaded it.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isIndependent }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0; font-size:16px;\">You're an <strong style=\"color:var(--ap-warn);\">independent student<\u002Fstrong>. You report only your own info, no parent data required. Your form is shorter than most.<\u002Fp>\n          <\u002Fsc-if>\n\n          <div style=\"margin-top:20px; padding-top:18px; border-top:1px solid var(--ap-border);\">\n            <div style=\"font-family:'Geist Mono', ui-monospace, monospace; font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--ap-mint); margin-bottom:12px;\">The order of operations<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:10px;\">\n              <sc-for list=\"{{ orderSteps }}\" as=\"os\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; gap:12px; align-items:flex-start;\">\n                  <span style=\"display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:9999px; background:#0083FF; color:#FFFFFF; font-size:12px; font-weight:700; flex-shrink:0; margin-top:1px;\">{{ os.n }}<\u002Fspan>\n                  <div style=\"font-size:15px;\">{{ os.t }}<small style=\"display:block; color:var(--ap-muted); font-size:13px; margin-top:2px;\">{{ os.s }}<\u002Fsmall><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"font-size:13px; color:var(--ap-muted); margin:14px 0 0;\">The tabs below follow that order: gather documents first, then walk the form, then handle what comes after.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; gap:4px; margin:32px 0 16px; border-bottom:1px solid var(--ap-border); flex-wrap:wrap;\">\n          <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"3\">\n            <sc-if value=\"{{ tb.on }}\" hint-placeholder-val=\"{{ false }}\">\n              <button type=\"button\" sc-camel-on-click=\"{{ tb.pick }}\" style=\"font-family:inherit; font-size:15px; font-weight:600; background:var(--ap-card); border:none; padding:12px 18px; cursor:pointer; color:var(--ap-fg); border-bottom:3px solid #0083FF; border-radius:10px 10px 0 0; margin-bottom:-1px; display:flex; align-items:center; gap:10px;\">\n                <span style=\"display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:9999px; background:#0083FF; color:#FFFFFF; font-size:12px; font-weight:700; flex-shrink:0;\">{{ tb.n }}<\u002Fspan>{{ tb.t }}\n              <\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ tb.off }}\" hint-placeholder-val=\"{{ true }}\">\n              <button type=\"button\" sc-camel-on-click=\"{{ tb.pick }}\" style=\"font-family:inherit; font-size:15px; font-weight:600; background:none; border:none; padding:12px 18px; cursor:pointer; color:var(--ap-muted); border-bottom:3px solid transparent; border-radius:10px 10px 0 0; margin-bottom:-1px; display:flex; align-items:center; gap:10px; transition:color .15s ease-out, background .15s ease-out;\" style-hover=\"color:var(--ap-fg); background:var(--ap-hover)\">\n                <span style=\"display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:9999px; background:var(--ap-border); color:var(--ap-muted); font-size:12px; font-weight:700; flex-shrink:0;\">{{ tb.n }}<\u002Fspan>{{ tb.t }}\n              <\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ tabDocs }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:var(--ap-card); border:1px solid var(--ap-border); border-radius:16px; padding:22px 24px; animation:fade .3s ease;\">\n            <h3 style=\"margin:0; font-size:20px; font-weight:600;\">Complete the following by September 15<\u002Fh3>\n            <div style=\"font-size:12px; color:var(--ap-mint); letter-spacing:0.04em; margin:6px 0 4px;\">Based on who's on your form<\u002Fdiv>\n            <p style=\"font-size:13px; color:var(--ap-link); margin:6px 0 8px;\">{{ docProgress }}<\u002Fp>\n            <sc-for list=\"{{ docGroups }}\" as=\"grp\" hint-placeholder-count=\"2\">\n            <div>\n            <div style=\"font-size:12.5px; font-weight:600; color:var(--ap-link); letter-spacing:0.04em; text-transform:uppercase; margin:18px 0 2px;\">{{ grp.label }}<\u002Fdiv>\n            <div style=\"font-size:13px; color:var(--ap-muted); margin-bottom:2px;\">{{ grp.note }}<\u002Fdiv>\n            <sc-for list=\"{{ grp.items }}\" as=\"doc\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ doc.toggle }}\" style=\"display:flex; gap:13px; padding:12px 0; border-top:1px solid var(--ap-border); align-items:flex-start; cursor:pointer;\">\n                <sc-if value=\"{{ doc.done }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"width:21px; height:21px; border:2px solid #0083FF; background:#0083FF; border-radius:6px; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;\">\n                    <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ doc.open }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"width:21px; height:21px; border:2px solid var(--ap-border-strong); border-radius:6px; flex-shrink:0; margin-top:1px;\"><\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"font-size:15px;\">\n                  <sc-if value=\"{{ doc.done }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"text-decoration:line-through; color:var(--ap-subtle);\">{{ doc.t }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ doc.open }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span>{{ doc.t }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <small style=\"display:block; color:var(--ap-muted); font-size:13px; margin-top:3px;\">{{ doc.s }}<\u002Fsmall>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ tabWalk }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fade .3s ease;\">\n            <sc-for list=\"{{ walkSteps }}\" as=\"st\" hint-placeholder-count=\"6\">\n              <details open=\"{{ st.open }}\" style=\"border:1px solid var(--ap-border); border-radius:16px; margin:12px 0; overflow:hidden; background:var(--ap-card);\">\n                <summary style=\"font-size:15.5px; font-weight:600; padding:16px 20px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:16px;\">\n                  <span><span style=\"color:var(--ap-warn); font-weight:700; margin-right:10px;\">{{ st.n }}<\u002Fspan>{{ st.h }}<\u002Fspan>\n                  <span style=\"display:flex; align-items:center; gap:12px; flex-shrink:0;\">\n                    <span style=\"font-size:12px; font-weight:600; letter-spacing:0.04em; color:var(--ap-warn); background:var(--ap-warn-bg); border-radius:9999px; padding:4px 12px; white-space:nowrap;\">{{ st.when }}<\u002Fspan>\n                    <span style=\"color:var(--ap-link); font-size:20px; font-weight:400;\">+<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fsummary>\n                <div style=\"padding:0 20px 20px; font-size:15.5px; color:var(--ap-muted);\">\n                  <p style=\"margin:0 0 12px;\">{{ st.b }}<\u002Fp>\n                  <sc-if value=\"{{ st.hasTip }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:13.5px; background:var(--ap-warn-bg); border-left:3px solid var(--ap-warn); padding:10px 14px; border-radius:6px; color:var(--ap-warn);\">Watch out: {{ st.tip }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdetails>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ tabAfter }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:var(--ap-card); border:1px solid var(--ap-border); border-radius:16px; padding:22px 24px; animation:fade .3s ease;\">\n            <h3 style=\"margin:0; font-size:20px; font-weight:600;\">Close the loop after you file<\u002Fh3>\n            <div style=\"font-size:12px; color:var(--ap-mint); letter-spacing:0.04em; margin:6px 0 10px;\">Crucial steps to confirm completion<\u002Fdiv>\n            <div style=\"display:flex; align-items:baseline; gap:16px; padding:14px 0; border-top:1px solid var(--ap-border);\">\n              <div style=\"font-weight:700; font-size:15px; color:var(--ap-link); min-width:104px;\">Days later<\u002Fdiv>\n              <div style=\"font-size:14.5px;\">Review your submission summary<small style=\"display:block; color:var(--ap-muted); font-size:12.5px; margin-top:2px;\">You'll get a summary with your Student Aid Index. Check it for obvious errors; you can correct and resubmit.<\u002Fsmall><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:baseline; gap:16px; padding:14px 0; border-top:1px solid var(--ap-border);\">\n              <div style=\"font-weight:700; font-size:15px; color:var(--ap-warn); min-width:104px;\">Verification<\u002Fdiv>\n              <div style=\"font-size:14.5px;\">Were you selected for verification?<small style=\"display:block; color:var(--ap-muted); font-size:12.5px; margin-top:2px;\">About 1 in 4 filers are. The school asks for documents to confirm what you reported. It's routine, not an accusation, and it's often random rather than a sign you did something wrong.<\u002Fsmall>\n                <div style=\"display:flex; gap:6px; margin-top:10px;\">\n                  <sc-if value=\"{{ flaggedYesSel }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ setFlaggedYes }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:#0083FF; color:#FFFFFF; border:1px solid #0083FF; padding:7px 16px; border-radius:6px; cursor:pointer;\">Yes<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ flaggedYesOff }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ setFlaggedYes }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:transparent; color:var(--ap-muted); border:1px solid var(--ap-border); padding:7px 16px; border-radius:6px; cursor:pointer; transition:border-color .15s;\" style-hover=\"border-color:var(--ap-border-strong)\">Yes<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ flaggedNoSel }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ setFlaggedNo }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:#0083FF; color:#FFFFFF; border:1px solid #0083FF; padding:7px 16px; border-radius:6px; cursor:pointer;\">Not so far<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ flaggedNoOff }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ setFlaggedNo }}\" style=\"font-family:inherit; font-size:13px; font-weight:600; background:transparent; color:var(--ap-muted); border:1px solid var(--ap-border); padding:7px 16px; border-radius:6px; cursor:pointer; transition:border-color .15s;\" style-hover=\"border-color:var(--ap-border-strong)\">Not so far<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ flaggedNoSel }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:12.5px; color:var(--ap-muted); margin-top:10px;\">Good. Keep an eye on your school portal and email anyway; schools can select a file weeks after you submit.<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ flaggedYesSel }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:var(--ap-task-bg); border-left:3px solid var(--ap-warn); border-radius:8px; padding:14px 16px; margin-top:12px; animation:fade .3s ease;\">\n                  <div style=\"font-size:12.5px; font-weight:600; color:var(--ap-link); letter-spacing:0.04em; text-transform:uppercase; margin-bottom:8px;\">1 · Get your info together<\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:2px;\">\n                    <sc-for list=\"{{ verifyItems }}\" as=\"vi\" hint-placeholder-count=\"5\">\n                      <div sc-camel-on-click=\"{{ vi.toggle }}\" style=\"display:flex; gap:10px; align-items:flex-start; padding:6px 0; cursor:pointer;\">\n                        <sc-if value=\"{{ vi.done }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"width:18px; height:18px; border:2px solid #0083FF; background:#0083FF; border-radius:5px; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;\">\n                            <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ vi.open }}\" hint-placeholder-val=\"{{ true }}\">\n                          <div style=\"width:18px; height:18px; border:2px solid var(--ap-border-strong); border-radius:5px; flex-shrink:0; margin-top:1px;\"><\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ vi.done }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"font-size:12.5px; color:var(--ap-subtle); text-decoration:line-through;\">{{ vi.t }}<\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ vi.open }}\" hint-placeholder-val=\"{{ true }}\">\n                          <div style=\"font-size:12.5px; color:var(--ap-muted);\">{{ vi.t }}<\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12.5px; font-weight:600; color:var(--ap-link); letter-spacing:0.04em; text-transform:uppercase; margin:16px 0 8px;\">2 · Complete the Verification Process<\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:2px;\">\n                    <sc-for list=\"{{ verifyActions }}\" as=\"va\" hint-placeholder-count=\"3\">\n                      <div sc-camel-on-click=\"{{ va.toggle }}\" style=\"display:flex; gap:10px; align-items:flex-start; padding:6px 0; cursor:pointer;\">\n                        <sc-if value=\"{{ va.done }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"width:18px; height:18px; border:2px solid #0083FF; background:#0083FF; border-radius:5px; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;\">\n                            <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ va.open }}\" hint-placeholder-val=\"{{ true }}\">\n                          <div style=\"width:18px; height:18px; border:2px solid var(--ap-border-strong); border-radius:5px; flex-shrink:0; margin-top:1px;\"><\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ va.done }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"font-size:12.5px; color:var(--ap-subtle); text-decoration:line-through;\">{{ va.t }}<\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ va.open }}\" hint-placeholder-val=\"{{ true }}\">\n                          <div style=\"font-size:12.5px; color:var(--ap-muted);\">{{ va.t }}<\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12.5px; color:var(--ap-muted); margin-top:10px;\">Schools usually take two to four weeks to review, and an incomplete packet restarts that clock. Nothing disburses until verification closes, so a slow response can push your bill past its due date. If the deadline is close, tell the aid office; they can often note that your documents are in.<\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:baseline; gap:16px; padding:14px 0; border-top:1px solid var(--ap-border);\">\n              <div style=\"font-weight:700; font-size:15px; color:var(--ap-link); min-width:104px;\">Weeks later<\u002Fdiv>\n              <div style=\"font-size:14.5px;\">Compare your award letters<small style=\"display:block; color:var(--ap-muted); font-size:12.5px; margin-top:2px;\">Each school sends an offer. They mix grants (free), loans (repaid), and work-study. Compare the free money, not the sticker \"total aid.\"<\u002Fsmall><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:baseline; gap:16px; padding:14px 0; border-top:1px solid var(--ap-border);\">\n              <div style=\"font-weight:700; font-size:15px; color:var(--ap-link); min-width:104px;\">Anytime<\u002Fdiv>\n              <div style=\"font-size:14.5px;\">Appeal if your situation changed<small style=\"display:block; color:var(--ap-muted); font-size:12.5px; margin-top:2px;\">Lost a job, medical bills, a death in the family? Ask the aid office for a \"professional judgment\" review. Many people never ask, and it's real money.<\u002Fsmall><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex; justify-content:space-between; align-items:center; margin-top:40px; gap:16px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ goTriage }}\" style=\"font-family:inherit; background:none; border:none; color:var(--ap-link); cursor:pointer; font-size:14px; padding:8px 0;\" style-hover=\"text-decoration:underline\">← Change my answers<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ printPlan }}\" style=\"font-family:inherit; font-size:15px; font-weight:600; background:transparent; color:var(--ap-fg); border:1px solid var(--ap-border-strong); padding:13px 26px; border-radius:8px; cursor:pointer;\" style-hover=\"background:var(--ap-border)\">Print / save plan<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"font-size:12.5px; color:var(--ap-subtle); border-top:1px solid var(--ap-border); margin-top:60px; padding-top:20px; line-height:1.6;\">\n          Level All FAFSA is a free guidance tool, not a filing service and not affiliated with the U.S. Department of Education. File your FAFSA directly and for free at studentaid.gov. Rules change every award year; confirm anything time-sensitive against the current cycle. If a family situation is complex (mixed-status household, estranged parents, homelessness), your school's financial aid office can help and can grant dependency overrides.\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst SCREENER = [\n  { id:\"age\", q:\"Will you be 24 or older by Jan 1 of the school year?\" },\n  { id:\"grad\", q:\"Are you working on a master's or doctorate?\" },\n  { id:\"married\", q:\"Are you married, or separated but not divorced?\" },\n  { id:\"kids\", q:\"Do you have children or dependents you support more than half?\" },\n  { id:\"military\", q:\"Are you a U.S. veteran, or currently on active duty (not training)?\" },\n  { id:\"foster\", q:\"Since age 13, were you an orphan, in foster care, or a ward of the court?\" },\n  { id:\"guardian\", q:\"Are you an emancipated minor, or in a legal guardianship, by court order?\" },\n  { id:\"homeless\", q:\"Have you been unaccompanied and homeless, or at risk of it, on your own?\" }\n];\n\nclass Component extends DCLogic {\n  state = {\n    screen: 0, tab: 0,\n    sc: {},\n    spouse: null, parentStatus: null, supportParent: null,\n    filed: {}, docsDone: {}, verifyDone: {}, flagged: null,\n    theme: \"dark\"\n  };\n\n  componentDidMount() {\n    try {\n      const saved = localStorage.getItem(\"aidpath-theme\");\n      if (saved === \"light\" || saved === \"dark\") this.setState({ theme: saved });\n    } catch (e) {}\n  }\n\n  toggleTheme = () => {\n    this.setState(s => {\n      const next = s.theme === \"dark\" ? \"light\" : \"dark\";\n      try { localStorage.setItem(\"aidpath-theme\", next); } catch (e) {}\n      return { theme: next };\n    });\n  };\n\n  verdict() {\n    const s = this.state.sc;\n    if (!SCREENER.every(q => s[q.id] !== undefined)) return null;\n    return SCREENER.some(q => s[q.id] === true) ? \"independent\" : \"dependent\";\n  }\n\n  contributors() {\n    const v = this.verdict();\n    if (!v) return null;\n    const out = [{ id:\"you\", role:\"You (the student)\" }];\n    if (v === \"independent\") {\n      if (this.state.spouse === null) return null;\n      if (this.state.spouse === \"yes\") out.push({ id:\"spouse\", role:\"Your spouse\" });\n      return out;\n    }\n    if (this.state.parentStatus === null) return null;\n    if (this.state.parentStatus === \"together\") {\n      out.push({ id:\"p1\", role:\"Parent 1\" });\n      out.push({ id:\"p2\", role:\"Parent 2\" });\n    } else {\n      if (this.state.supportParent === null) return null;\n      out.push({ id:\"p1\", role:\"The parent who supported you most\" });\n      if (this.state.supportParent === \"remarried\") out.push({ id:\"step\", role:\"That parent's spouse (stepparent)\" });\n    }\n    return out;\n  }\n\n  settled() {\n    const list = this.contributors();\n    return !!list && list.every(c => this.state.filed[c.id] !== undefined);\n  }\n\n  go(n) {\n    this.setState({ screen: n });\n    window.scrollTo({ top: 0, behavior: \"smooth\" });\n  }\n\n  setScreener(id, val) {\n    this.setState(s => ({\n      sc: Object.assign({}, s.sc, { [id]: val }),\n      spouse: null, parentStatus: null, supportParent: null, filed: {}\n    }));\n  }\n\n  docGroups() {\n    const list = this.contributors() || [{ id:\"you\", role:\"You (the student)\" }];\n    const filed = this.state.filed;\n    const others = list.filter(c => c.id !== \"you\");\n\n    const yours = [\n      { t:\"Your FSA ID (account username + password)\", s:\"The form is yours; you own it and you submit it. Create the account at least 3 days early so the SSA can verify you.\" },\n      { t:\"Your Social Security number\", s:\"Or your A-number if you're an eligible noncitizen.\" },\n      { t:\"Your driver's license or state ID\", s:\"If you have one; not required.\" },\n      { t:\"Your consent to the IRS data transfer\", s:\"You approve a direct pull of your own tax data. Nobody types income figures anymore.\" },\n      { t:\"Your asset balances\", s:\"Savings, checking, and any investments in your name. Not your home or retirement accounts.\" },\n      { t:\"Your school list\", s:\"Every college you might attend. They only see that they're listed, not the order.\" }\n    ];\n    if (filed.you === true) yours.push({ t:\"Your tax return on hand as a backup\", s:\"The IRS transfer does the work, but keep it nearby in case a figure needs review.\" });\n    if (filed.you === false) yours.push({ t:\"Your records of untaxed income\", s:\"Benefits, cash support, or wages that didn't require a return.\" });\n\n    const groups = [{\n      label: \"Your information\",\n      note: \"You fill out this part. It's your form and your signature.\",\n      items: yours\n    }];\n\n    if (others.length) {\n      const names = others.map(c => c.role).join(\" and \");\n      const theirs = [\n        { t:\"A separate FSA ID for \" + names, s:\"Each person creates their OWN account with their OWN email. A shared login is the #1 reason a form stalls.\" },\n        { t:\"Their Social Security numbers\", s:\"Or A-numbers. They enter these themselves; you never type them.\" },\n        { t:\"Their consent to the IRS data transfer\", s:\"Each one consents separately in their own section. If even one person skips it, your form can't be processed.\" },\n        { t:\"Their asset balances\", s:\"Reported in their section, not yours.\" }\n      ];\n      if (others.some(c => filed[c.id] === true)) theirs.push({ t:\"Their tax return on hand as a backup\", s:\"For anyone who filed. The IRS transfer handles it, but keep it accessible.\" });\n      if (others.some(c => filed[c.id] === false)) theirs.push({ t:\"Non-filer records of untaxed income\", s:\"They still consent, then confirm they didn't file.\" });\n      groups.push({\n        label: \"Your contributors' information\",\n        note: \"You invite \" + names + \" by email. Each logs in separately and fills their own page; you never see or enter their data.\",\n        items: theirs\n      });\n    }\n    return groups;\n  }\n\n  walkSteps() {\n    const contributor = this.verdict() === \"dependent\";\n    const steps = [{\n      n:\"01\", when:\"By Sept 15\", h:\"Create your FSA ID first\",\n      b:\"You don't have to wait for October. Accounts can be made any time, and doing it early is the whole point: after you enter your SSN, the Social Security Administration has to match your info, which takes a few days before the account is fully usable.\",\n      tip:\"If you get an error, it's almost always a name or SSN mismatch. Fix it now, not on deadline day.\"\n    }];\n    if (contributor) steps.push({\n      n:\"02\", when:\"By Sept 15\", h:\"Have each contributor make their OWN account\",\n      b:\"Every parent or contributor who provides info needs a separate FSA ID with their own email. You'll invite them to the form; they sign their own section.\",\n      tip:\"Two people can't share one login. This is the most common reason a form stalls.\"\n    });\n    steps.push(\n      { n: contributor ? \"03\" : \"02\", when:\"By Sept 15\", h:\"Gather your documents\",\n        b:\"The form itself can't be started before it opens, so late summer is prep: SSNs, asset balances, your school list, and records of untaxed income all sitting in one folder. The Documents tab is your checklist.\", tip:\"\" },\n      { n: contributor ? \"04\" : \"03\", when:\"Oct 1\", h:\"Start the form and answer the dependency questions\",\n        b:\"The form asks a short set of questions (age, marriage, military, dependents, foster care). Your honest answers set whether parent info is required. You don't decide it; the questions do.\", tip:\"\" },\n      { n: contributor ? \"05\" : \"04\", when:\"Oct 1\", h:\"Consent to the IRS data exchange\",\n        b:\"Instead of typing income, you'll approve a direct transfer from the IRS. \" + (contributor ? \"Every contributor must give consent separately.\" : \"You give consent once.\") + \" No consent, no processing, so this is not optional.\",\n        tip:\"Even a $0 income or non-filer has to consent. Skipping it silently kills the application.\" },\n      { n: contributor ? \"06\" : \"05\", when:\"Oct 1\", h:\"Report assets and list your schools\",\n        b:\"Add current balances (skip your home and retirement accounts). Then list every school you might attend; they only see that they're listed, not the order.\",\n        tip:\"List a school even if you're unsure. Adding later means it processes later, and some aid is first-come.\" },\n      { n: contributor ? \"07\" : \"06\", when:\"Oct 1\", h:\"Sign and submit\",\n        b:\"You sign, and \" + (contributor ? \"each contributor signs their part\" : \"that's it\") + \". Watch for the confirmation page and a confirmation email. If you don't get one, it didn't go through.\",\n        tip:\"Screenshot the confirmation. It has your estimated aid figure and your submission date.\" }\n    );\n    return steps;\n  }\n\n  renderVals() {\n    const st = this.state;\n    const v = this.verdict();\n    const list = this.contributors();\n    const settled = this.settled();\n    const labels = [\"Start\", \"Your situation\", \"Your plan\"];\n\n    const branchRows = [];\n    if (v === \"independent\") {\n      branchRows.push({\n        label: \"Are you married (and not separated)?\",\n        hint: \"Married students report a spouse; single students report only themselves.\",\n        opts: [[\"yes\",\"Yes\"],[\"no\",\"No\"]].map(([val, t]) => ({\n          t, sel: st.spouse === val, off: st.spouse !== val,\n          pick: () => this.setState({ spouse: val, filed: {} })\n        }))\n      });\n    } else if (v === \"dependent\") {\n      branchRows.push({\n        label: \"Are your parents married to each other, or living together?\",\n        hint: \"This decides whether one parent or two are contributors.\",\n        opts: [[\"together\",\"Yes, together\"],[\"split\",\"No, split up\"]].map(([val, t]) => ({\n          t, sel: st.parentStatus === val, off: st.parentStatus !== val,\n          pick: () => this.setState({ parentStatus: val, supportParent: null, filed: {} })\n        }))\n      });\n      if (st.parentStatus === \"split\") branchRows.push({\n        label: \"Has the parent who supported you most remarried?\",\n        hint: \"If so, that stepparent's info is required too.\",\n        opts: [[\"remarried\",\"Yes, remarried\"],[\"single\",\"No\"]].map(([val, t]) => ({\n          t, sel: st.supportParent === val, off: st.supportParent !== val,\n          pick: () => this.setState({ supportParent: val, filed: {} })\n        }))\n      });\n    }\n\n    const rawGroups = this.docGroups();\n    let docTotal = 0, doneCount = 0;\n    const docGroups = rawGroups.map((g, gi) => ({\n      label: g.label,\n      note: g.note,\n      items: g.items.map((it, i) => {\n        const key = gi + \"-\" + i;\n        docTotal++;\n        if (st.docsDone[key]) doneCount++;\n        return {\n          t: it.t, s: it.s,\n          done: !!st.docsDone[key], open: !st.docsDone[key],\n          toggle: () => this.setState(s => ({ docsDone: Object.assign({}, s.docsDone, { [key]: !s.docsDone[key] }) }))\n        };\n      })\n    }));\n\n    return {\n      pips: [0,1,2].map(i => ({ done: i < st.screen, active: i === st.screen })),\n      stepLabel: labels[st.screen] || \"\",\n      theme: st.theme,\n      isDark: st.theme === \"dark\",\n      isLight: st.theme === \"light\",\n      toggleTheme: this.toggleTheme,\n      isHero: st.screen === 0, isTriage: st.screen === 1, isPlan: st.screen === 2,\n      goHero: () => this.go(0),\n      goTriage: () => this.go(1),\n      buildPlan: () => { this.setState({ tab: 0 }); this.go(2); },\n      printPlan: () => window.print(),\n\n      screenerRows: SCREENER.map(q => ({\n        q: q.q,\n        yesSel: st.sc[q.id] === true, yesOff: st.sc[q.id] !== true,\n        noSel: st.sc[q.id] === false, noOff: st.sc[q.id] !== false,\n        setYes: () => this.setScreener(q.id, true),\n        setNo: () => this.setScreener(q.id, false)\n      })),\n      hasVerdict: !!v,\n      isIndependent: v === \"independent\",\n      isDependent: v === \"dependent\",\n      branchRows,\n      showFiling: !!list,\n      filingRows: (list || []).map(c => ({\n        role: c.role,\n        filedSel: st.filed[c.id] === true, filedOff: st.filed[c.id] !== true,\n        noneSel: st.filed[c.id] === false, noneOff: st.filed[c.id] !== false,\n        setFiled: () => this.setState(s => ({ filed: Object.assign({}, s.filed, { [c.id]: true }) })),\n        setNone: () => this.setState(s => ({ filed: Object.assign({}, s.filed, { [c.id]: false }) }))\n      })),\n      rosterSettled: settled,\n      rosterNames: settled ? list.map(c => c.role.replace(\" (the student)\", \"\")).join(\", \") : \"\",\n      rosterTail: settled\n        ? (list.some(c => st.filed[c.id] === false)\n            ? \"The non-filer(s) will confirm they didn't file after consenting.\"\n            : \"All of them can use the automatic IRS transfer.\")\n        : \"\",\n      canContinue: !!v && settled,\n      cantContinue: !(!!v && settled),\n\n      flaggedYesSel: st.flagged === true, flaggedYesOff: st.flagged !== true,\n      flaggedNoSel: st.flagged === false, flaggedNoOff: st.flagged !== false,\n      setFlaggedYes: () => this.setState({ flagged: true }),\n      setFlaggedNo: () => this.setState({ flagged: false }),\n\n      verifyItems: [\n        \"A verification worksheet from the school, signed by you and any parent-contributor\",\n        \"An IRS tax return transcript, or a signed copy of the return, for each contributor\",\n        \"A non-filer statement from anyone who didn't file, sometimes with an IRS verification of non-filing letter\",\n        \"Photo ID and a statement of educational purpose, if identity is what's being verified\",\n        \"Proof of household size or benefits in some cases\"\n      ].map((t, i) => ({\n        t, done: !!st.verifyDone[i], open: !st.verifyDone[i],\n        toggle: () => this.setState(s => ({ verifyDone: Object.assign({}, s.verifyDone, { [i]: !s.verifyDone[i] }) }))\n      })),\n\n      verifyActions: [\n        \"Submit everything in one batch on the school portal, not by email\",\n        \"Call the financial aid office to verify they received it\",\n        \"Check back in two weeks if you haven't heard anything\"\n      ].map((t, i) => ({\n        t, done: !!st.verifyDone[\"a\" + i], open: !st.verifyDone[\"a\" + i],\n        toggle: () => this.setState(s => ({ verifyDone: Object.assign({}, s.verifyDone, { [\"a\" + i]: !s.verifyDone[\"a\" + i] }) }))\n      })),\n\n      orderSteps: [\n        { n:\"1\", t:\"Gather your documents\", s:\"FSA IDs, SSN, and records — everything the form will ask for, in hand by September 15.\" },\n        { n:\"2\", t:\"Walk through the form\", s:\"Accounts, dependency questions, IRS consent, assets and schools, then sign and submit.\" },\n        { n:\"3\", t:\"Handle what comes after\", s:\"Review your summary, respond to verification, compare awards, and appeal if things change.\" }\n      ],\n\n      tabs: [\"Documents\",\"Walkthrough\",\"After you file\"].map((t, i) => ({\n        t, n: String(i + 1), on: st.tab === i, off: st.tab !== i, pick: () => this.setState({ tab: i })\n      })),\n      tabDocs: st.tab === 0, tabWalk: st.tab === 1, tabAfter: st.tab === 2,\n      docGroups,\n      docProgress: doneCount + \" of \" + docTotal + \" ready\" + (doneCount === docTotal ? \" · you're set to start\" : \"\"),\n      walkSteps: this.walkSteps().map((s, i) => ({\n        n: s.n, when: s.when, h: s.h, b: s.b, tip: s.tip, hasTip: !!s.tip, open: i === 0\n      }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
