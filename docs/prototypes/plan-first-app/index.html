<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan-First App</title>
<style>
@font-face { font-family:"Graphik"; src:url("../../fonts/GraphikRegular.otf") format("opentype");  font-weight:400; font-display:swap; }
@font-face { font-family:"Graphik"; src:url("../../fonts/GraphikMedium.otf") format("opentype");   font-weight:500; font-display:swap; }
@font-face { font-family:"Graphik"; src:url("../../fonts/GraphikSemibold.otf") format("opentype"); font-weight:600; font-display:swap; }

:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#EEF2F8; --surface-3:#E4EAF3;
  --line:#DCE3EE; --line-2:#C3CDDC;
  --ink:#0B1A33; --ink-2:#43536F; --ink-3:#6A7891;
  --accent:#0083FF; --accent-ink:#0064C8; --accent-soft:#E2EFFF; --accent-line:#A9CFFF;
  --ok:#1C7F53; --ok-soft:#DFF3E8;
  --warn:#A35F00; --warn-soft:#FFF0D6;
  --note:#7A3EC8; --note-soft:#F1E8FD;
  --navy:#061530; --navy-2:#16294f; --navy-line:#22386b; --navy-soft:#93c5fd;
  --sh:0 1px 2px rgba(11,26,51,.05), 0 6px 18px -10px rgba(11,26,51,.18);
  --r:12px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111F; --surface:#0F1B2E; --surface-2:#14233A; --surface-3:#1B2D48;
  --line:#1F3150; --line-2:#2C4268;
  --ink:#E8EEF8; --ink-2:#A8B6CC; --ink-3:#7F8EA8;
  --accent:#3D9DFF; --accent-ink:#7DBDFF; --accent-soft:#0F2A4D; --accent-line:#24538A;
  --ok:#5BC48F; --ok-soft:#10301F;
  --warn:#E6A44A; --warn-soft:#33240C;
  --note:#B993F0; --note-soft:#271A3D;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1B2E; --surface-2:#14233A; --surface-3:#1B2D48;
  --line:#1F3150; --line-2:#2C4268;
  --ink:#E8EEF8; --ink-2:#A8B6CC; --ink-3:#7F8EA8;
  --accent:#3D9DFF; --accent-ink:#7DBDFF; --accent-soft:#0F2A4D; --accent-line:#24538A;
  --ok:#5BC48F; --ok-soft:#10301F;
  --warn:#E6A44A; --warn-soft:#33240C;
  --note:#B993F0; --note-soft:#271A3D;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Graphik",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:600; letter-spacing:-.015em; text-wrap:balance}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

/* ---------- prototype controls (outside the app) ---------- */
.demo{position:sticky; top:0; z-index:50; background:var(--navy); color:#fff; border-bottom:1px solid var(--navy-line)}
.demo__in{display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px; padding:10px 20px; max-width:1280px; margin:0 auto}
.demo__lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--navy-soft)}
.demo__back{color:var(--navy-soft); text-decoration:none; font-size:13px}
.demo__back:hover{color:#fff}
.grades{display:flex; gap:3px; background:var(--navy-2); border:1px solid var(--navy-line); border-radius:9px; padding:3px}
.grades button{border:0; background:transparent; color:var(--navy-soft); border-radius:6px; min-width:36px; padding:5px 8px; font-size:13.5px; font-weight:500}
.grades button:hover{color:#fff; background:rgba(255,255,255,.06)}
.grades button[aria-pressed="true"]{background:#0083FF; color:#fff}
.switch{display:flex; align-items:center; gap:8px; border:1px solid var(--navy-line); background:var(--navy-2); color:var(--navy-soft);
  border-radius:20px; padding:5px 12px 5px 8px; font-size:13px}
.switch i{width:26px; height:15px; border-radius:10px; background:#2b4370; position:relative; transition:background .15s}
.switch i::after{content:""; position:absolute; top:2px; left:2px; width:11px; height:11px; border-radius:50%; background:#fff; transition:transform .15s}
.switch[aria-pressed="true"]{color:#fff}
.switch[aria-pressed="true"] i{background:var(--note)}
.switch[aria-pressed="true"] i::after{transform:translateX(11px)}
.demo__r{margin-left:auto; display:flex; gap:10px; align-items:center}

/* ---------- app shell ---------- */
.app{display:grid; grid-template-columns:232px minmax(0,1fr); max-width:1280px; margin:0 auto; min-height:calc(100vh - 56px)}
.side{position:sticky; top:56px; align-self:start; height:calc(100vh - 56px); padding:22px 14px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:22px}
.brand{display:flex; align-items:center; gap:9px; padding:0 10px; font-weight:600; font-size:17px}
.brand svg{width:20px; height:20px; color:var(--accent)}
.tabs{display:flex; flex-direction:column; gap:3px}
.tab{display:flex; align-items:center; gap:11px; border:0; background:transparent; text-align:left; padding:10px 12px; border-radius:10px; color:var(--ink-2); font-weight:500}
.tab svg{width:20px; height:20px; flex:none}
.tab:hover{background:var(--surface-2); color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft); color:var(--accent-ink)}
.tab small{margin-left:auto; font-size:11px; color:var(--ink-3); font-weight:400}
.who{margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px; background:var(--surface); border:1px solid var(--line)}
.ava{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#0083FF,#7A3EC8); color:#fff; display:grid; place-items:center; font-weight:600; font-size:13px; flex:none}
.who b{display:block; font-size:14px; font-weight:600}
.who span{font-size:12px; color:var(--ink-3)}

main{min-width:0; padding:28px 32px 96px}
.page{max-width:860px; margin:0 auto}

/* ---------- shared bits ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh)}
.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding:3px 9px; border-radius:20px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap}
.pill.focus{background:var(--accent); color:#fff}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.soft{background:var(--accent-soft); color:var(--accent-ink)}
.btn{border:1px solid var(--line-2); background:var(--surface); border-radius:9px; padding:7px 13px; font-size:13.5px; font-weight:500}
.btn:hover{border-color:var(--accent); color:var(--accent-ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent-ink); color:#fff}
.btn.added{background:var(--ok-soft); border-color:transparent; color:var(--ok)}
.muted{color:var(--ink-3)}
.note{display:none; margin-top:8px; font-size:12px; color:var(--note); background:var(--note-soft); border-radius:7px; padding:5px 9px; width:fit-content}
body.notes .note{display:block}
.note b{font-weight:600}

/* ---------- plan header ---------- */
.hello{display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 16px; margin-bottom:20px}
.hello h1{font-size:30px; line-height:1.15}
.hello p{color:var(--ink-2); margin-top:4px}

/* stage road */
.road{padding:18px 18px 14px; margin-bottom:18px}
.road__track{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin-top:12px}
.stage{position:relative; border:0; background:transparent; text-align:left; padding:0 0 4px}
.stage__bar{height:8px; border-radius:6px; background:var(--surface-3); margin-bottom:10px; overflow:hidden; position:relative}
.stage__bar span{position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:6px}
.stage__name{display:block; font-size:13.5px; font-weight:600; color:var(--ink-2)}
.stage__gr{display:block; font-size:12px; color:var(--ink-3)}
.stage.past .stage__bar span{width:100%; background:var(--ok)}
.stage.past .stage__name{color:var(--ink-2)}
.stage.now .stage__name{color:var(--accent-ink)}
.stage.future .stage__name{color:var(--ink-3); font-weight:500}
.stage.future .stage__bar{background:repeating-linear-gradient(90deg,var(--surface-3) 0 6px,transparent 6px 10px)}
.stage[aria-expanded="true"] .stage__name{text-decoration:underline; text-underline-offset:3px}
.stage:hover .stage__name{color:var(--ink)}
.preview{margin-top:14px; padding:14px 16px; border-radius:10px; background:var(--surface-2); display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center}
.preview div{flex:1 1 320px}
.preview h3{font-size:15px}
.preview p{font-size:14px; color:var(--ink-2); margin-top:2px}

/* this week */
.week{padding:18px 18px 8px; margin-bottom:26px}
.week__h{display:flex; align-items:baseline; gap:10px; margin-bottom:6px}
.week__h h2{font-size:18px}
.todo{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.check{flex:none; width:22px; height:22px; margin-top:1px; border-radius:7px; border:1.5px solid var(--line-2); background:var(--surface); display:grid; place-items:center; padding:0}
.check svg{width:14px; height:14px; opacity:0; color:#fff}
.todo.done .check{background:var(--ok); border-color:var(--ok)}
.todo.done .check svg{opacity:1}
.todo.done .todo__t{text-decoration:line-through; color:var(--ink-3)}
.todo__t{font-weight:500}
.todo__m{display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:4px; font-size:12.5px; color:var(--ink-3)}
.todo__due{margin-left:auto; flex:none; font-size:12.5px; color:var(--ink-3); white-space:nowrap; padding-top:2px}
.todo__due.soon{color:var(--warn); font-weight:500}

/* plan sections */
.sec-h{display:flex; align-items:baseline; gap:10px; margin:0 0 12px}
.sec-h h2{font-size:18px}
.sections{display:flex; flex-direction:column; gap:14px}
.sec{padding:18px}
.sec__top{display:flex; align-items:flex-start; gap:12px}
.sec__icon{width:36px; height:36px; border-radius:10px; background:var(--accent-soft); color:var(--accent-ink); display:grid; place-items:center; flex:none}
.sec__icon svg{width:19px; height:19px}
.sec__title{flex:1; min-width:0}
.sec__title h3{font-size:16.5px}
.sec__title p{font-size:13.5px; color:var(--ink-3)}
.sec__body{margin-top:14px}
.sec.focus{border-color:var(--accent-line); box-shadow:0 0 0 1px var(--accent-line), var(--sh)}
.sec.ghost{background:transparent; border-style:dashed; box-shadow:none}
.sec.ghost .sec__icon{background:var(--surface-2); color:var(--ink-3)}
.sec.ghost h3{color:var(--ink-2)}
.ghost-msg{margin-top:12px; font-size:14px; color:var(--ink-2); max-width:62ch}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:8px; padding:7px 8px 7px 12px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); font-size:14px}
.chip small{color:var(--ink-3); font-size:12px}
.chip .x{border:0; background:transparent; width:22px; height:22px; border-radius:6px; color:var(--ink-3); display:grid; place-items:center; padding:0}
.chip .x:hover{background:var(--surface-3); color:var(--ink)}
.chip.star{border-color:var(--accent-line); background:var(--accent-soft)}
.add-link{border:1px dashed var(--line-2); background:transparent; border-radius:10px; padding:7px 12px; font-size:14px; color:var(--ink-2)}
.add-link:hover{border-color:var(--accent); color:var(--accent-ink)}

.subhead{font-size:12.5px; font-weight:600; color:var(--ink-3); margin:16px 0 8px}
.subhead:first-child{margin-top:0}

/* pathway picker */
.paths{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.path{border:1.5px solid var(--line); background:var(--surface); border-radius:11px; padding:12px; text-align:left}
.path:hover{border-color:var(--accent-line)}
.path[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.path b{display:block; font-size:14.5px; font-weight:600}
.path span{display:block; font-size:12.5px; color:var(--ink-3); margin-top:3px}
.path .fit{display:inline-block; margin-top:8px; font-size:11.5px; font-weight:500; color:var(--ok); background:var(--ok-soft); padding:2px 8px; border-radius:20px}
.review{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line)}

/* courses grid */
.years{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
.year{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface)}
.year.now{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.year.later{border-style:dashed; background:transparent}
.year__h{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px}
.year__h b{font-size:13.5px}
.year__h span{font-size:11px; color:var(--ink-3)}
.year ul{list-style:none; margin:0; padding:0; font-size:13px; color:var(--ink-2)}
.year li{padding:2px 0}
.year li.cte{color:var(--accent-ink); font-weight:500}
.year li em{font-style:normal; font-size:11px; color:var(--ink-3)}

/* rows */
.rows{display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line)}
.row:first-child{border-top:0; padding-top:0}
.row__main{flex:1; min-width:0}
.row__main b{display:block; font-weight:500; font-size:14.5px}
.row__main span{font-size:12.5px; color:var(--ink-3)}
.row__val{font-size:14px; font-weight:600; white-space:nowrap}
.callout{margin-top:12px; padding:11px 13px; border-radius:10px; background:var(--ok-soft); color:var(--ok); font-size:13.5px}
.callout b{font-weight:600}
.bar{height:7px; border-radius:6px; background:var(--surface-3); overflow:hidden; margin-top:6px}
.bar span{display:block; height:100%; background:var(--accent); border-radius:6px}

/* ---------- explore / learn / me ---------- */
.page-h{margin-bottom:18px}
.page-h h1{font-size:28px}
.page-h p{color:var(--ink-2); margin-top:4px; max-width:64ch}
.cats{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px}
.cat{border:1px solid var(--line); background:var(--surface); border-radius:20px; padding:6px 14px; font-size:13.5px; font-weight:500; color:var(--ink-2)}
.cat:hover{border-color:var(--accent-line)}
.cat[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--surface)}
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.item{padding:16px; display:flex; flex-direction:column; gap:8px}
.item h3{font-size:16px}
.item p{font-size:13.5px; color:var(--ink-2)}
.item__meta{display:flex; flex-wrap:wrap; gap:6px}
.item__foot{display:flex; align-items:center; gap:10px; margin-top:auto; padding-top:6px}
.item__foot .muted{font-size:12.5px}
.why{font-size:12.5px; color:var(--accent-ink)}
.learn-row{display:flex; gap:14px; padding:16px; align-items:center}
.learn-row + .learn-row{margin-top:10px}
.thumb{width:52px; height:52px; border-radius:12px; display:grid; place-items:center; color:#fff; flex:none; font-weight:600; font-size:12px}
.learn-row .row__main b{font-size:15.5px; font-weight:600}
.moves{display:inline-flex; align-items:center; gap:6px; margin-top:6px; font-size:12.5px; color:var(--accent-ink); background:var(--accent-soft); padding:3px 9px; border-radius:20px}
.me-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.me-grid .card{padding:18px}
.me-grid h2{font-size:16.5px; margin-bottom:10px}
.report{display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line)}
.report:first-of-type{border-top:0}
.report__main{flex:1}
.report__main b{display:block; font-weight:500}
.report__main span{font-size:12.5px; color:var(--ink-3)}
.span2{grid-column:1/-1}

/* toast */
.toast{position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); opacity:0; pointer-events:none; background:var(--ink); color:var(--surface);
  padding:10px 16px; border-radius:10px; font-size:14px; font-weight:500; box-shadow:var(--sh); transition:opacity .2s, transform .2s; z-index:60}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* ---------- mobile ---------- */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed; z-index:40; top:auto; bottom:0; left:0; right:0; height:auto; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    border-right:0; border-top:1px solid var(--line); background:var(--surface); flex-direction:row}
  .brand,.who{display:none}
  .tabs{flex-direction:row; width:100%; justify-content:space-around}
  .tab{flex-direction:column; gap:3px; padding:6px 4px; font-size:11.5px; flex:1; align-items:center}
  .tab small{display:none}
  main{padding:20px 16px 110px}
  .demo__in{padding:9px 16px; gap:8px 14px}
  .demo__r{margin-left:0}
  .hello h1{font-size:25px}
  .road__track{grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px}
  .stage__name{font-size:11.5px; line-height:1.25}
  .stage__gr{font-size:10.5px}
  .paths,.grid,.me-grid{grid-template-columns:minmax(0,1fr)}
  .years{grid-template-columns:repeat(2,minmax(0,1fr))}
  .todo__due{display:none}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>

<div class="demo" role="region" aria-label="Prototype controls">
  <div class="demo__in">
    <a class="demo__back" href="../../">← Playground</a>
    <span class="demo__lbl">Student grade</span>
    <div class="grades" id="grades"></div>
    <div class="demo__r">
      <button class="switch" id="notesBtn" aria-pressed="false"><i></i>Show roadmap notes</button>
    </div>
  </div>
</div>

<div class="app">
  <nav class="side" aria-label="Main">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" fill-rule="evenodd"><path d="M8.36 0 L8.36 3.392 L19.962 3.392 L19.962 15.343 L23.355 15.343 L23.355 0 L8.36 0 Z"/><path d="M0 8.357 L0 11.749 L11.602 11.749 L11.602 23.7 L14.996 23.7 L14.996 8.357 L0 8.357 Z"/></g></svg>
      Level All
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="who">
      <div class="ava">MT</div>
      <div><b>Maya Torres</b><span id="whoGrade"></span></div>
    </div>
  </nav>
  <main id="main"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   Data
   ============================================================ */
const STAGES = [
  {id:'discover', name:'Discover',           grades:[6,7],  q:'What am I into? What jobs exist?',
   blurb:'Take quizzes, try projects, and save careers that catch your eye. Nothing is locked in.'},
  {id:'choose',   name:'Choose a direction', grades:[8],    q:'Which high school pathway fits me?',
   blurb:'Pick a pathway and draft your 9th grade courses. Your counselor reviews it with you.'},
  {id:'build',    name:'Build',              grades:[9,10], q:'Am I taking the right classes and trying things?',
   blurb:'Keep your course plan on track, log activities, and get real experience in fields you like.'},
  {id:'narrow',   name:'Narrow',             grades:[11],   q:'Where will I go, and what will it cost?',
   blurb:'Build a list of colleges and programs, see what each really costs, and plan your tests.'},
  {id:'launch',   name:'Launch',             grades:[12],   q:'Apply, pay, decide.',
   blurb:'Send applications, finish the FAFSA, win scholarships, and pick where you are going.'}
];
const stageOf = g => STAGES.find(s => s.grades.includes(g));
const stageIdx = g => STAGES.indexOf(stageOf(g));
const ord = g => g + 'th';

/* Explore catalog. seed = grade at which Maya has already saved it. */
const CATALOG = [
  {id:'vet',  kind:'career', title:'Veterinarian',        meta:['$119k median','Doctorate'],         seed:6, blurb:'Diagnose and treat animals, from pets to livestock.'},

function chipList(kind, opts={}){
  const items = saved(kind);
  const star = opts.star;
  const chips = items.map(it => `
    <span class="chip ${star && it.id===star ? 'star':''}">
      ${star && it.id===star ? '★ ':''}${it.title}${opts.meta ? ` <small>${it.meta[opts.meta]}</small>`:''}
      <button class="x" data-act="remove" data-id="${it.id}" aria-label="Remove ${it.title}">${I.x}</button>

  return `<div class="chips">${chips || ''}<button class="add-link" data-act="explore" data-cat="${kind}">+ Find ${KIND[kind].label.toLowerCase()}</button></div>`;

function viewPlan(){
  const g = S.grade, st = stageOf(g), si = stageIdx(g);
  const road = STAGES.map((s,i) => {
    const cls = i<si ? 'past' : i===si ? 'now' : 'future';
    let fill = i<si ? '<span></span>' : '';
    if (i===si){ const pos = s.grades.indexOf(g); fill = `<span style="width:${Math.round((pos+1)/(s.grades.length+1)*100)}%"></span>`; }
    const gr = s.grades.length>1 ? `Grades ${s.grades[0]}–${s.grades[s.grades.length-1]}` : `Grade ${s.grades[0]}`;
    return `<button class="stage ${cls}" data-act="preview" data-id="${s.id}" aria-expanded="${S.preview===s.id}">
      <div class="stage__bar">${fill}</div><span class="stage__name">${s.name}</span><span class="stage__gr">${gr}</span></button>`;
  }).join('');
  let prev = '';
  if (S.preview){
    const p = STAGES.find(s=>s.id===S.preview), pi = STAGES.indexOf(p);
    const rel = pi<si ? 'You did this' : pi===si ? 'You are here' : 'Coming up';
    prev = `<div class="preview"><div><p class="eyebrow">${rel}</p><h3>${p.name}: ${p.q}</h3><p>${p.blurb}</p></div>
      ${pi!==si ? `<button class="btn" data-act="grade" data-g="${p.grades[0]}">See ${ord(p.grades[0])} grade</button>`:''}</div>`;
  }

  const todos = (WEEK[g]||[]).map((t,i) => {
    const key = g+'-'+i, done = S.done.has(key);
    return `<div class="todo ${done?'done':''}">
      <button class="check" data-act="todo" data-k="${key}" aria-pressed="${done}" aria-label="Mark “${t.t}” done">${I.check}</button>
      <div style="flex:1;min-width:0"><div class="todo__t">${t.t}</div><div class="todo__m">${t.m.map(x=>`<span>${x}</span>`).join('<span>·</span>')}</div></div>
      ${t.due ? `<span class="todo__due ${t.soon?'soon':''}">${t.due}</span>`:''}</div>`;
  }).join('');

  // order: focus sections first, then open, then ghost
  const rank = s => s.focus.includes(g) ? 0 : g >= s.opens ? 1 : 2;
  const secs = [...SECTIONS].sort((a,b) => rank(a)-rank(b) || SECTIONS.indexOf(a)-SECTIONS.indexOf(b)).map(s => {
    const r = rank(s);
    const cls = r===0 ? 'focus' : r===2 ? 'ghost' : '';
    const badge = r===0 ? '<span class="pill focus">Focus now</span>' : r===2 ? `<span class="pill">Opens in ${ord(s.opens)} grade</span>` : '';
    let body;
    if (r===2 && s.id!=='path') body = `<p class="ghost-msg">${GHOST[s.id](g)}</p>`;
    else body = `<div class="sec__body">${window['body_'+s.id](g)}</div>`;
    return `<section class="card sec ${cls}" id="sec-${s.id}">
      <div class="sec__top"><div class="sec__icon">${s.icon}</div>
        <div class="sec__title"><h3>${s.title}</h3><p>${s.sub}</p></div>${badge}</div>
      ${body}${note(s.note)}</section>`;
  }).join('');

  return `<div class="page">
    <div class="hello">
      <div><p class="eyebrow">${ord(g)} grade · ${st.name}</p><h1>Hi Maya. ${st.q}</h1>
      <p>Your plan runs from 6th grade to graduation. It fills in as you go.</p></div>
    </div>
    <div class="card road">
      <p class="eyebrow">Your road</p>
      <div class="road__track">${road}</div>${prev}
      ${note('<b>One living plan</b>, not a form per year. Carry-forward from <b>CAP Improvements</b> (P-ENG-82) is the model, not a feature. The plan follows Maya when she changes schools.')}
    </div>
    <div class="card week">
      <div class="week__h"><h2>This week</h2><span class="muted" style="font-size:13px">${(WEEK[g]||[]).length - [...S.done].filter(k=>k.startsWith(g+'-')).length} to do</span></div>
      ${todos}
      ${note('Replaces a separate home page: <b>Homepage</b> (P-ENG-67), <b>Content Related Deadlines</b> (P-ENG-108) and <b>Push Notifications</b> (P-ENG-104) all feed this list.')}
    </div>
    <div class="sec-h"><h2>My plan</h2><span class="muted" style="font-size:13px">Goals, steps, and what you’ve done</span></div>
    <div class="sections">${secs}</div>
  </div>`;
}

function viewExplore(){
  const g = S.grade;
  const cats = Object.keys(KIND).filter(k => CATALOG.some(it => it.kind===k && visible(it)));
  if (!cats.includes(S.cat)) S.cat = cats[0];
  const items = CATALOG.filter(it => it.kind===S.cat && visible(it));
  const savedCareers = saved('career').map(c=>c.title);
  const cards = items.map(it => {
    const on = isSaved(it);
    let why = '';
    if (it.kind==='career' && !on && ['wild','bme','pt','rn'].includes(it.id) && savedCareers.length) why = `Because you saved ${savedCareers[0]}`;
    if (it.kind==='college' && !on) why = 'Has a nursing program';
    if (it.kind==='opp' && !on) why = 'Matches your interest in health care';
    return `<article class="card item">
      <h3>${it.title}</h3>
      <div class="item__meta">${it.meta.map(m=>`<span class="pill">${m}</span>`).join('')}</div>
      <p>${it.blurb}</p>${why ? `<span class="why">${why}</span>`:''}
      <div class="item__foot">
        <button class="btn ${on?'added':'primary'}" data-act="${on?'remove':'add'}" data-id="${it.id}">${on?'✓ In your plan':'Add to my plan'}</button>
        <span class="muted">${on ? 'Under '+KIND[it.kind].sectionName : 'Goes to '+KIND[it.kind].sectionName}</span>
      </div></article>`;
  }).join('');
  return `<div class="page">
    <div class="page-h"><p class="eyebrow">Explore</p><h1>What’s out there</h1>
      <p>One place to search careers, ${g<=8?'high school pathways':'colleges and programs'}, opportunities${g>=11?', and scholarships':''}. Everything you save goes straight into your plan.</p>
      ${note('<b>Career Discovery</b>, the <b>College & Scholarship Finder</b>, <b>Opportunities 2</b> (P-ENG-121) and the <b>Recommendation Engine</b> (P-ENG-66) share one search and one “Add to my plan” action. Categories appear by grade.')}</div>
    <div class="cats">${cats.map(k=>`<button class="cat" data-act="cat" data-cat="${k}" aria-pressed="${S.cat===k}">${KIND[k].label}</button>`).join('')}</div>
    <div class="grid">${cards}</div></div>`;
}

function viewLearn(){
  const st = stageOf(S.grade);
  const rows = LEARN[st.id].map(l => `<article class="card learn-row">
      <div class="thumb" style="background:${l.c}">${l.k.split(' ')[0].slice(0,4)}</div>
      <div class="row__main"><span class="muted" style="font-size:12.5px">${l.k} · ${l.by}</span><b>${l.t}</b>
        <span class="moves">Moves forward: ${l.moves}</span>
        ${l.p ? `<div class="bar" style="max-width:220px"><span style="width:${l.p}%"></span></div>`:''}</div>
      <button class="btn ${l.p?'primary':''}">${l.p?'Continue':'Start'}</button></article>`).join('');
  return `<div class="page">
    <div class="page-h"><p class="eyebrow">Learn · ${st.name}</p><h1>What to work on</h1>
      <p>Journeys, projects, and lists your teachers share. Each one says which part of your plan it moves forward, so nothing is busywork.</p>
      ${note('Journeys and projects become means, not ends. <b>Discovery Page Enhancements</b> (P-PRO-118) lists show up here; <b>End of Content Screens</b> (P-ENG-100) become “here’s how this changed your plan.”')}</div>
    ${rows}</div>`;
}

function viewMe(){
  const g = S.grade;
  const reports = [
    g>=8 && {t:'Nevada Academic Plan', s:'State-required · generated from your plan'},
    {t:'Career Development Plan', s:'Required by your district · generated from your plan'},
    g>=12 && {t:'Common App Activities', s:'5 activities ready to copy'},
    g>=9 && {t:'Résumé', s:'Built from your experiences'}
  ].filter(Boolean);
  const viewers = [
    {n:'Ms. Rivera', r:'Middle school counselor', on:g<=8},
    {n:'Mr. Okafor', r:'High school counselor', on:g>=9},
    {n:'Mom', r:'Family', on:g>=8}
  ].filter(v=>v.on);
  return `<div class="page">
    <div class="page-h"><p class="eyebrow">Me</p><h1>Maya Torres</h1>
      <p>${ord(g)} grade · ${g<=8?'Billinghurst Middle School':'Galena High School'}. Everything you’ve shared and done, in one place. Your plan pulls from here.</p></div>
    <div class="me-grid">
      <div class="card"><h2>About me</h2>
        <p class="subhead">Interests</p><div class="chips"><span class="pill soft">Helping people</span><span class="pill soft">Science</span><span class="pill soft">Animals</span></div>
        ${g>=8?`<p class="subhead">Strengths</p><div class="chips"><span class="pill soft">Patient</span><span class="pill soft">Detail-oriented</span><span class="pill soft">Calm under pressure</span></div>`:''}
      </div>
      <div class="card"><h2>What I’ve done</h2>
        <div class="rows">
          <div class="row"><div class="row__main"><b>Activities</b><span>Clubs, volunteering, jobs</span></div><span class="row__val">${EXPERIENCES.filter(e=>e.from<=g&&(!e.to||g<=e.to)).length}</span></div>
          <div class="row"><div class="row__main"><b>Documents</b><span>Transcripts, certificates, essays</span></div><span class="row__val">${g<9?1:g<11?4:g<12?7:11}</span></div>
          <div class="row"><div class="row__main"><b>Journeys finished</b><span>Across every grade</span></div><span class="row__val">${(g-5)*3}</span></div>
        </div></div>
      <div class="card span2"><h2>Made from your plan</h2>
        ${reports.map(r=>`<div class="report"><div class="report__main"><b>${r.t}</b><span>${r.s}</span></div><span class="pill ok">Up to date</span><button class="btn">Preview</button></div>`).join('')}
        ${note('The state plan is a <b>report</b>, not a place. Nothing here is a separate form to fill out, which resolves the canceled <b>Career Development Plan</b> (P-ENG-102).')}
      </div>
      <div class="card span2"><h2>Who can see your plan</h2>
        ${viewers.map(v=>`<div class="report"><div class="ava" style="width:30px;height:30px;font-size:12px">${v.n.split(' ').pop()[0]}</div><div class="report__main"><b>${v.n}</b><span>${v.r}</span></div><span class="pill">${v.r==='Family'?'Can view':'Can view & comment'}</span></div>`).join('')}
        ${note('Educators open this same plan from their roster. Open question: should families see it from 6th grade, or from 8th as shown here?')}
      </div>
    </div></div>`;
}

/* ============================================================
   Render + events
   ============================================================ */
const TABS = [{id:'plan',label:'My Plan',icon:I.plan,hint:'Home'},{id:'explore',label:'Explore',icon:I.explore},{id:'learn',label:'Learn',icon:I.learn},{id:'me',label:'Me',icon:I.me}];
const $ = id => document.getElementById(id);

function render(){
  $('grades').innerHTML = [6,7,8,9,10,11,12].map(g=>`<button data-act="grade" data-g="${g}" aria-pressed="${S.grade===g}">${g}</button>`).join('');
  $('tabs').innerHTML = TABS.map(t=>`<button class="tab" data-act="tab" data-tab="${t.id}" ${S.tab===t.id?'aria-current="page"':''}>${t.icon}<span>${t.label}</span>${t.hint?`<small>${t.hint}</small>`:''}</button>`).join('');
  $('whoGrade').textContent = `${ord(S.grade)} grade · ${stageOf(S.grade).name}`;
  $('main').innerHTML = {plan:viewPlan, explore:viewExplore, learn:viewLearn, me:viewMe}[S.tab]();
  document.body.classList.toggle('notes', S.notes);
  $('notesBtn').setAttribute('aria-pressed', S.notes);
}

let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a==='grade'){ S.grade=+b.dataset.g; S.preview=null; window.scrollTo({top:0}); }
  else if (a==='tab'){ S.tab=b.dataset.tab; window.scrollTo({top:0}); }
  else if (a==='preview'){ S.preview = S.preview===id ? null : id; }
  else if (a==='todo'){ const k=b.dataset.k; S.done.has(k)?S.done.delete(k):S.done.add(k); }
  else if (a==='explore'){ S.tab='explore'; S.cat=b.dataset.cat; window.scrollTo({top:0}); }
  else if (a==='cat'){ S.cat=b.dataset.cat; }
  else if (a==='add'){ const it=CATALOG.find(x=>x.id===id); S.removed.delete(id); S.added.add(id); toast(`Added ${it.title} to ${KIND[it.kind].sectionName}`); }
  else if (a==='remove'){ const it=CATALOG.find(x=>x.id===id); S.added.delete(id); S.removed.add(id); toast(`Removed ${it.title} from your plan`); }
  else if (a==='pathway'){ S.pathway=id; S.sent=false; }
  else if (a==='send'){ S.sent=true; toast('Sent to Ms. Rivera for review'); }
  else return;
  render();
});
$('notesBtn').addEventListener('click', () => { S.notes=!S.notes; render(); });

render();
</script>
</body>
